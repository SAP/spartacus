@if (isPunchoutSessionActive$ | async) {
  @if (cart$ | async; as cart) {
    @if (entries$ | async; as entries) {
      <div class="punchoutStartSection">
        <cx-cart-item-list
          [readonly]="true"
          [items]="entries"
          [options]="{
            isSaveForLater: false,
            disableItemLink: true,
          }"
        ></cx-cart-item-list>
      </div>
      <div class="punchoutEndSection">
        <cx-order-summary [cart]="cart"></cx-order-summary>

        <cx-punchout-buttons [removeCancelButton]="true"></cx-punchout-buttons>
      </div>
    }
  }
}
