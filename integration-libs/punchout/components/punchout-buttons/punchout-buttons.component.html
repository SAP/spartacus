@if ((isPunchoutSessionActive$ | async) === true) {
  <button
    type="button"
    class="btn btn-block btn-primary"
    (click)="submitRequisition(false)"
  >
    {{ 'punchout.backToRequisition' | cxTranslate }}
  </button>
  @if (!removeCancelButton) {
    <button
      type="button"
      class="btn btn-block btn-primary"
      (click)="submitRequisition(true)"
    >
      {{ 'punchout.cancel' | cxTranslate }}
    </button>
  }
}
