<div
  [cxFocus]="focusConfig"
  (esc)="close('Escape clicked')"
  class="cx-modal-container"
  role="dialog"
  aria-labelledby="dialogTitle"
  aria-modal="true"
>
  <div class="cx-modal-content">
    <div class="cx-dialog-header modal-header">
      <div id="dialogTitle" class="cx-dialog-title modal-title">
        <span>
          {{ 's4omOrder.attachments.dialog.title' | cxTranslate }}
        </span>
        <span *ngIf="attachmentsCount() as count" class="attachments-counter">
          {{ '(' + count + ')' }}
        </span>
      </div>
      <button
        type="button"
        class="close"
        attr.aria-label="{{
          's4omOrder.attachments.dialog.closeModal' | cxTranslate
        }}"
        title="{{ 's4omOrder.attachments.dialog.closeModal' | cxTranslate }}"
        (click)="close('Close dialog')"
      >
        <span aria-hidden="true">
          <cx-icon [type]="iconTypes.CLOSE"></cx-icon>
        </span>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="cx-dialog-body modal-body">
      <cx-message
        *ngFor="let errorId of erroredAttachments"
        [text]="'s4omOrder.attachments.dialog.downloadError' | cxTranslate"
        [type]="globalMessageType.MSG_TYPE_ERROR"
        (closeMessage)="closeErrorMessage(errorId)"
        class="cx-dialog-message attachment-error"
      >
      </cx-message>
      <ng-container *ngIf="attachments$ | async as attachments; else loading">
        <ng-container *ngIf="!loadError(); else error">
          <ng-container *ngIf="attachmentsCount(); else empty">
            <table class="table">
              <ng-container *ngFor="let attachment of attachments">
                <tr
                  *ngIf="attachment.attachmentId"
                  class="order-attachment-row"
                >
                  <td>
                    <a
                      attr.aria-label="{{
                        's4omOrder.attachments.dialog.preview' | cxTranslate
                      }}"
                      title="{{
                        's4omOrder.attachments.dialog.preview' | cxTranslate
                      }}"
                      [ngClass]="{
                        disabled: loadingAttachments.includes(
                          attachment.attachmentId
                        ),
                      }"
                      (mousedown)="
                        onMouseDown(
                          $event,
                          attachment.attachmentId,
                          attachment.fileName
                        )
                      "
                      (keydown.enter)="
                        openOrderAttachment(
                          attachment.attachmentId,
                          attachment.fileName
                        )
                      "
                    >
                      {{ attachment.fileName }}
                    </a>
                  </td>
                  <td>
                    <div
                      class="inline-spinner"
                      [ngClass]="{
                        hidden: !loadingAttachments.includes(
                          attachment.attachmentId
                        ),
                      }"
                    >
                      <cx-spinner></cx-spinner>
                    </div>
                  </td>
                  <td>
                    <a
                      tabindex="0"
                      role="button"
                      class="file-icon"
                      attr.aria-label="{{
                        's4omOrder.attachments.dialog.preview' | cxTranslate
                      }}"
                      title="{{
                        's4omOrder.attachments.dialog.preview' | cxTranslate
                      }}"
                      [ngClass]="{
                        disabled: loadingAttachments.includes(
                          attachment.attachmentId
                        ),
                      }"
                      (click)="
                        openOrderAttachment(
                          attachment.attachmentId,
                          attachment.fileName
                        )
                      "
                      (keydown.enter)="
                        openOrderAttachment(
                          attachment.attachmentId,
                          attachment.fileName
                        )
                      "
                    >
                      <cx-icon [type]="iconTypes.FILE"></cx-icon>
                    </a>
                  </td>
                </tr>
              </ng-container>
            </table>
          </ng-container>
        </ng-container>
      </ng-container>
    </div>

    <!-- Modal Footer -->
    <div class="cx-dialog-footer modal-footer">
      <button
        (click)="close('Cancel dialog')"
        [attr.aria-label]="'common.cancel' | cxTranslate"
        class="btn btn-secondary cancel-button"
        type="button"
      >
        {{ 'common.cancel' | cxTranslate }}
      </button>
    </div>
  </div>
</div>

<ng-template #error>
  <cx-message
    [text]="'s4omOrder.attachments.dialog.error' | cxTranslate"
    [type]="globalMessageType.MSG_TYPE_ERROR"
    [isVisibleCloseButton]="false"
    class="cx-dialog-message error-message"
  >
  </cx-message>
</ng-template>
<ng-template #empty>
  <cx-message
    [text]="'s4omOrder.attachments.dialog.empty' | cxTranslate"
    [type]="globalMessageType.MSG_TYPE_INFO"
    [isVisibleCloseButton]="false"
    class="cx-dialog-message info-message"
  >
  </cx-message>
</ng-template>
<ng-template #loading>
  <div class="cx-spinner">
    <cx-spinner></cx-spinner>
  </div>
</ng-template>
