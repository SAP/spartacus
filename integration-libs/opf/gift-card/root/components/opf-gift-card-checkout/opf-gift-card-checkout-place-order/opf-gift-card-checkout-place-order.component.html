@if (cart$ | async; as cart) {
  @if (cart.opfGiftCardSummary?.giftCardsCoverFullAmount) {
    <div class="cx-opf-gift-card-place-order-container">
      <button
        type="button"
        class="btn btn-primary"
        (click)="placeOrderWithGiftCard()"
      >
        {{ 'opfGiftCard.proceedPayment' | cxTranslate }}
      </button>
    </div>
  }
}
