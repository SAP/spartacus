<ng-container *ngIf="isGiftCardPayment">
  <div class="cx-opf-gift-card-payment-method-detail">
    <ng-container
      *ngIf="
        order?.opfGiftCardSummary?.giftCardsCoverFullAmount;
        else giftCardPayment
      "
    >
      <div class="cx-gift-card-full-payment">
        <cx-card [content]="getPaymentMethodCardContent() | async"></cx-card>
      </div>
    </ng-container>

    <ng-template #giftCardPayment>
      <div class="cx-gift-card-partial-payment">
        <cx-card
          [content]="{ text: ['opfGiftCard.giftCardPayment' | cxTranslate] }"
        ></cx-card>
      </div>
    </ng-template>
  </div>
</ng-container>
