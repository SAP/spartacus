@if (isOrderDetailsPage$ | async) {
  <div class="cx-review-summary-card cx-review-summary-payment-card">
    @if (isGiftCardPayment) {
      <div class="cx-opf-gift-card-order-detail-billing-card">
        @if (!order.paymentInfo?.cardNumber) {
          <cx-card [content]="getPaymentMethodCardContent() | async" />
        } @else {
          <cx-card
            [content]="{ text: ['opfGiftCard.giftCardPayment' | cxTranslate] }"
          />
        }
      </div>
    }
  </div>
}
