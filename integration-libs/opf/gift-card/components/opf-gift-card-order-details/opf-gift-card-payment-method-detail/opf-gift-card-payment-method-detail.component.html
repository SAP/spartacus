<ng-container *ngIf="isGiftCardPayment">
  <div class="gift-card-payment-card">
    <ng-container
      *ngIf="
        order?.sapGiftCardSummary?.giftCardsCoverFullAmount;
        else giftCardPayment
      "
    >
      <cx-card [content]="getPaymentMethodCardContent() | async"></cx-card>
    </ng-container>

    <ng-template #giftCardPayment>
      <cx-card
        [content]="{ text: ['giftCard.giftCardPayment' | cxTranslate] }"
      ></cx-card>
    </ng-template>
  </div>
</ng-container>
