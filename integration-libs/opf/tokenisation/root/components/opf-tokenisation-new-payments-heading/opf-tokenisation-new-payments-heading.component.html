@if (context$ | async; as ctx) {
  @if (ctx.hasSavedCards === true) {
    <div
      class="cx-payment-options-section"
      [attr.aria-label]="
        ctx.newPaymentHeading || ('opfCheckout.newPaymentHeading' | cxTranslate)
      "
    >
      <h3 class="cx-payment-section-heading">
        {{
          ctx.newPaymentHeading ||
            ('opfCheckout.newPaymentHeading' | cxTranslate)
        }}
      </h3>
    </div>
  }
}
