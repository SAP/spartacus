<ng-container *ngIf="isPaymentMethodDetailsInfoPresent(order)">
  <cx-card
    *ngIf="order.paymentInfo"
    [content]="
      getPaymentMethodDetailsCardContent(order.paymentInfo.sapPaymentMethod)
        | async
    "
  ></cx-card>
</ng-container>
<ng-template
  [cxOutlet]="opfCheckoutOutlets.ORDER_OVERVIEW_GIFT_CARD"
  [cxOutletContext]="order"
>
</ng-template>
