<section [attr.aria-label]="'opfCheckout.paymentOption' | cxTranslate">
  <h3 *ngIf="isHeadingDisplayed">
    {{ headingTranslationKey || 'opfCheckout.paymentOption' | cxTranslate }}
  </h3>

  <ng-container
    *ngIf="activeConfigurations$ | async as activeConfigurationsState"
  >
    <ng-container *ngIf="!activeConfigurationsState?.loading; else loading">
      <div class="cx-payment-options-list">
        <ng-content />
        <div
          *ngIf="
            !(
              opfPaymentEventsService.isGiftCardCoveredTotalAmountEvent$ | async
            )
          "
        >
          <ng-template
            *ngIf="showBeforePaymentOptionsOutlet"
            [cxOutlet]="opfCheckoutOutlets.OPF_CHECKOUT_BEFORE_PAYMENT_OPTIONS"
            [cxOutletContext]="outletContext$"
          />

          <div
            *ngFor="let configuration of activeConfigurationsState?.data?.value"
          >
            <ng-container>
              <ng-container
                *ngIf="!isOnlyOnePaymentOptionAvailable || forceRadioInputsView"
              >
                <div class="form-check">
                  <input
                    id="paymentId-{{ configuration.id }}"
                    class="form-check-input"
                    role="radio"
                    type="radio"
                    name="paymentId"
                    [attr.aria-checked]="
                      (paymentDisabled$ | async) &&
                      configuration.id === selectedPaymentId
                    "
                    (change)="changePayment(configuration)"
                    [value]="configuration.id"
                    [checked]="
                      !(paymentDisabled$ | async) &&
                      configuration.id === selectedPaymentId
                    "
                    formControlName="paymentId"
                    [disabled]="
                      (paymentDisabled$ | async) ||
                      (disabled && explicitTermsAndConditions)
                    "
                  />
                  <label
                    class="cx-payment-type-label form-check-label form-radio-label"
                    for="paymentId-{{ configuration.id }}"
                  >
                    <div class="cx-payment-type">
                      {{ configuration.displayName }}
                      <img
                        *ngIf="configuration?.logoUrl"
                        [src]="configuration.logoUrl"
                        [alt]="configuration.displayName"
                        class="cx-payment-logo"
                      />
                    </div>
                  </label>
                </div>
              </ng-container>
            </ng-container>
            <ng-container
              *ngIf="!renderPaymentWrapper && !(paymentDisabled$ | async)"
            >
              <div class="cx-payment-info-box">
                <span class="alert-icon" aria-hidden="true">
                  <cx-icon [type]="iconTypes.INFO" />
                </span>
                <p
                  class="cx-payment-info-box-message"
                  tabindex="0"
                  role="alert"
                  aria-live="polite"
                >
                  {{ noRenderPaymentWrapperMessage }}
                </p>
              </div>
            </ng-container>
            <ng-container
              *ngIf="renderPaymentWrapper && !(paymentDisabled$ | async)"
            >
              <ng-container *ngIf="isPaymentInfoMessageVisible">
                <ng-container
                  *ngIf="
                    getPaymentInfoMessage(configuration.id)
                      | async as paymentInfoMessage
                  "
                >
                  <div
                    *ngIf="configuration.id === selectedPaymentId"
                    class="cx-payment-info-box"
                  >
                    <span class="alert-icon" aria-hidden="true">
                      <cx-icon [type]="iconTypes.INFO" />
                    </span>
                    <p
                      class="cx-payment-info-box-message"
                      tabindex="0"
                      role="alert"
                      aria-live="polite"
                    >
                      {{ paymentInfoMessage }}
                    </p>
                  </div>
                </ng-container>
              </ng-container>

              <ng-container *ngIf="customPaymentTemplate">
                <ng-container *ngTemplateOutlet="customPaymentTemplate" />
              </ng-container>

              <cx-opf-checkout-payment-wrapper
                *ngIf="
                  !customPaymentTemplate &&
                  isPaymentRenderBelow &&
                  selectedPaymentId &&
                  configuration.id === selectedPaymentId
                "
                [selectedPaymentId]="selectedPaymentId"
              />
            </ng-container>
          </div>

          <cx-pagination
            class="cx-payment-options-list-pagination"
            [pagination]="paginationModel"
            (viewPageEvent)="pageChange($event)"
          />
        </div>
      </div>
    </ng-container>
  </ng-container>

  <ng-template #loading>
    <cx-spinner />
  </ng-template>
</section>
