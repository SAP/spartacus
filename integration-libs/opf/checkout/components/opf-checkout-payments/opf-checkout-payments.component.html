<section [attr.aria-label]="'opfCheckout.paymentOption' | cxTranslate">
  <h3 *ngIf="isHeadingDisplayed">
    {{ headingTranslationKey || 'opfCheckout.paymentOption' | cxTranslate }}
  </h3>

  <ng-container
    *ngIf="activeConfigurations$ | async as activeConfigurationsState"
  >
    <ng-container *ngIf="!activeConfigurationsState?.loading; else loading">
      <div class="cx-payment-options-list">
        <ng-content></ng-content>

        <!-- Saved Payment Options Section (only shown if saved cards exist) -->
        <ng-container *ngIf="hasSavedCards$ | async">
          <!-- Saved Payment Options Heading -->
          <div
            class="cx-payment-options-section"
            [attr.aria-label]="
              savedPaymentHeadingKey || 'opfCheckout.savedPaymentHeading'
                | cxTranslate
            "
          >
            <h3 class="cx-payment-section-heading">
              {{
                savedPaymentHeadingKey || 'opfCheckout.savedPaymentHeading'
                  | cxTranslate
              }}
            </h3>
          </div>

          <!-- Saved Payment Methods as Single Radio Option -->
          <div class="form-check cx-saved-cards-option">
            <input
              id="paymentId-saved-cards"
              class="form-check-input"
              role="radio"
              type="radio"
              [value]="SAVED_CARDS_ID"
              [checked]="selectedPaymentId === SAVED_CARDS_ID"
              formControlName="paymentId"
              [disabled]="
                (paymentDisabled$ | async) ||
                (disabled && explicitTermsAndConditions)
              "
              (change)="selectedPaymentId = SAVED_CARDS_ID"
            />

            <label
              class="cx-payment-type-label form-check-label form-radio-label"
              for="paymentId-saved-cards"
            >
              <div class="cx-payment-type">
                <!-- {{ 'opfCheckout.savedPaymentMethods' | cxTranslate }} -->
                <cx-icon
                  [type]="iconTypes.CREDIT_CARD"
                  style="font-size: 24px"
                ></cx-icon>
                <span> Cards</span>
              </div>
            </label>
          </div>

          <!-- Saved Cards List Container (shown when saved cards radio is selected) -->
          <ng-container *ngIf="selectedPaymentId === SAVED_CARDS_ID">
            <ng-template [cxOutlet]="opfCheckoutOutlets.OPF_TOKENISATION">
            </ng-template>
          </ng-container>
        </ng-container>

        <!-- New Payment Options Heading (only shown if saved cards exist) -->
        <ng-container *ngIf="hasSavedCards$ | async">
          <div
            class="cx-payment-options-section"
            [attr.aria-label]="
              newPaymentHeadingKey || 'opfCheckout.newPaymentHeading'
                | cxTranslate
            "
          >
            <h3 class="cx-payment-section-heading">
              {{
                newPaymentHeadingKey || 'opfCheckout.newPaymentHeading'
                  | cxTranslate
              }}
            </h3>
          </div>
        </ng-container>

        <div
          *ngFor="let configuration of activeConfigurationsState?.data?.value"
        >
          <ng-container>
            <ng-container
              *ngIf="!isOnlyOnePaymentOptionAvailable || forceRadioInputsView"
            >
              <div class="form-check">
                <input
                  id="paymentId-{{ configuration.id }}"
                  class="form-check-input"
                  role="radio"
                  type="radio"
                  [attr.aria-checked]="
                    (paymentDisabled$ | async) &&
                    configuration.id === selectedPaymentId
                  "
                  (change)="changePayment(configuration)"
                  [value]="configuration.id"
                  [checked]="
                    !(paymentDisabled$ | async) &&
                    configuration.id === selectedPaymentId
                  "
                  formControlName="paymentId"
                  [disabled]="
                    (paymentDisabled$ | async) ||
                    (disabled && explicitTermsAndConditions)
                  "
                />
                <label
                  class="cx-payment-type-label form-check-label form-radio-label"
                  for="paymentId-{{ configuration.id }}"
                >
                  <div class="cx-payment-type">
                    {{ configuration.displayName }}
                    <img
                      *ngIf="configuration?.logoUrl"
                      [src]="configuration.logoUrl"
                      [alt]="configuration.displayName"
                      class="cx-payment-logo"
                    />
                  </div>
                </label>
              </div>
            </ng-container>
          </ng-container>
          <ng-container
            *ngIf="!renderPaymentWrapper && !(paymentDisabled$ | async)"
          >
            <div class="cx-payment-info-box">
              <span class="alert-icon" aria-hidden="true">
                <cx-icon [type]="iconTypes.INFO"></cx-icon>
              </span>
              <p
                class="cx-payment-info-box-message"
                tabindex="0"
                role="alert"
                aria-live="polite"
              >
                {{ noRenderPaymentWrapperMessage }}
              </p>
            </div>
          </ng-container>
          <ng-container
            *ngIf="renderPaymentWrapper && !(paymentDisabled$ | async)"
          >
            <ng-container *ngIf="isPaymentInfoMessageVisible">
              <ng-container
                *ngIf="
                  getPaymentInfoMessage(configuration.id)
                    | async as paymentInfoMessage
                "
              >
                <div
                  *ngIf="configuration.id === selectedPaymentId"
                  class="cx-payment-info-box"
                >
                  <span class="alert-icon" aria-hidden="true">
                    <cx-icon [type]="iconTypes.INFO"></cx-icon>
                  </span>
                  <p
                    class="cx-payment-info-box-message"
                    tabindex="0"
                    role="alert"
                    aria-live="polite"
                  >
                    {{ paymentInfoMessage }}
                  </p>
                </div>
              </ng-container>
            </ng-container>

            <ng-container *ngIf="customPaymentTemplate">
              <ng-container
                *ngTemplateOutlet="customPaymentTemplate"
              ></ng-container>
            </ng-container>

            <cx-opf-checkout-payment-wrapper
              *ngIf="
                !customPaymentTemplate &&
                isPaymentRenderBelow &&
                selectedPaymentId &&
                configuration.id === selectedPaymentId
              "
              [selectedPaymentId]="selectedPaymentId"
            ></cx-opf-checkout-payment-wrapper>
          </ng-container>
        </div>

        <cx-pagination
          class="cx-payment-options-list-pagination"
          [pagination]="paginationModel"
          (viewPageEvent)="pageChange($event)"
        ></cx-pagination></div
    ></ng-container>
  </ng-container>

  <ng-template #loading>
    <cx-spinner></cx-spinner>
  </ng-template>
</section>
