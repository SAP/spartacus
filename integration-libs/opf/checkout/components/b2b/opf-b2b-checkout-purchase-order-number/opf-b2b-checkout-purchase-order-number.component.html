<div class="cx-po-number-info">

  <button
    [attr.aria-label]="'opfCheckout.editPoNumber' | cxTranslate"
    [attr.title]="'opfCheckout.editPoNumber' | cxTranslate"

      {
        cxRoute: getCheckoutStepUrl(checkoutStepTypePaymentType),

  </button>
</div>
