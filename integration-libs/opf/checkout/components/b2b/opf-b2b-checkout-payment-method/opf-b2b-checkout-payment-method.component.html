<div class="cx-review-summary-card">
  <cx-card
    [content]="getPaymentMethodCard(selectedPayment$ | async) | async"
  ></cx-card>
  <div class="cx-review-summary-edit-step">
    <a
      [attr.title]="'opf.checkout.editPaymentMethod' | cxTranslate"
      [routerLink]="
        { cxRoute: getCheckoutStepUrl(checkoutStepTypePaymentType) } | cxUrl
      "
    >
      <cx-icon aria-hidden="true" [type]="iconTypes.PENCIL"></cx-icon>
    </a>
  </div>
</div>
