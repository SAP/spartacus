<div class="cx-payment-method-info">
  <cx-card
    [content]="getPaymentMethodCard(selectedPayment$ | async) | async"
  ></cx-card>
  <button
    [attr.aria-label]="'opfCheckout.editPaymentMethod' | cxTranslate"
    [attr.title]="'opfCheckout.editPaymentMethod' | cxTranslate"
    [routerLink]="
      { cxRoute: getCheckoutStepUrl(checkoutStepTypePaymentType) } | cxUrl
    "
  >
    <cx-icon [type]="iconTypes.PENCIL"></cx-icon>
  </button>
</div>
