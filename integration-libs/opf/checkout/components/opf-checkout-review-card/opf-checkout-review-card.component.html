@if (cardContent$ | async; as content) {
  <cx-card [content]="content"></cx-card>
  @if (editConfig?.route) {
    <button
      class="cx-opf-card-review-edit-button"
      [routerLink]="{ cxRoute: editConfig.route } | cxUrl"
      [attr.aria-label]="
        editConfig.ariaLabelKey || 'opfCheckout.editCardDefaultLabel'
          | cxTranslate
      "
    >
      <cx-icon [type]="iconTypes.PENCIL"></cx-icon>
    </button>
  }
}
