on:
  pull_request:
    types: [ready_for_review]
    branches:
      - develop
      - develop-*
      - release/*

  workflow_dispatch:
    # empty as it is used only to manually trigger the workflow

permissions:
  contents: read
  pull-requests: write
  actions: write

env:
  CYPRESS_KEY: ${{ secrets.CYPRESS_KEY }}
  GH_TOKEN: ${{ github.token }}
  NODE_VERSION: '20'
  CONTINUUM_REGISTRY_TOKEN: ${{ secrets.CONTINUUM_REGISTRY_TOKEN }}
  SAP_COMMON_NPM_TOKEN: ${{ secrets.SAP_COMMON_NPM_TOKEN }}

concurrency:
  group: ci-merge-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

name: Merge Checks
jobs:
  detect_changes:
    name: MC - Detect changes
    runs-on: ubuntu-latest
    outputs:
      RUN_E2E_BY_CHANGES: ${{ steps.detect_code_changes.outputs.RUN_CHECKS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Detect code changes
        id: detect_code_changes
        uses: ./.github/actions/detect-changes

  no_retries:
    name: MC - Prevent retries
    # E2Es can't be retried.  Moreover, in some retry cases, they don't run
    # and the job returns a success code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Prevent retries
        uses: ./.github/actions/prevent-retries
  validate_e2e_execution:
    name: MC - Confirm e2es should run
    runs-on: ubuntu-latest
    outputs:
      SHOULD_RUN_E2E: ${{ steps.save-e2e-output-result.outputs.SHOULD_RUN_E2E }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
      - name: Determine whether to run e2es
        id: save-e2e-output-result
        run: |
          source ci-scripts/validate-e2e-execution.sh
          echo "SHOULD_RUN_E2E=$RUN_E2E" >> "$GITHUB_OUTPUT"
  build_libs:
    needs: [no_retries, validate_e2e_execution]
    name: MC - Build Spartacus libraries
    runs-on: ubuntu-latest
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Node and Cache
        uses: ./.github/actions/setup-node-and-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key: ${{ github.event.pull_request.base.sha }}
      - name: Install Cypress packages
        run: (cd projects/storefrontapp-e2e-cypress && npm ci)
      - name: Snapshot source files before build
        uses: ./.github/actions/build-integrity-check
        with:
          phase: snapshot
      - name: Build Spartacus libraries
        run: |
          source ci-scripts/npm-commands.sh
          export NODE_OPTIONS=--dns-result-order=ipv4first
          build_libs 2>&1 | tee build.log

          results=$(grep "Warning: Can't resolve all parameters for" build.log || true)
          if [[ -z "${results}" ]]; then
            echo "Success: Spartacus production build was successful."
            rm build.log
          else
            echo "ERROR: Spartacus production build failed."
            echo "Check for 'Warning: Can't resolve all parameters for ...' in the build log."
            rm build.log
            exit 1
          fi
      - name: Verify source file integrity after build
        uses: ./.github/actions/build-integrity-check
        with:
          phase: verify
      - name: Cache built libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 #v4.3.0
        with:
          path: |
            dist
          key: spartacus-libs-${{ github.event.pull_request.head.sha || github.run_id }}
  build_apps:
    needs: [build_libs]
    name: MC - Build Spartacus apps - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - spa_env: ci,b2c
            build_type: csr
            cache_key: ci-b2c
            name: B2C CSR
          - spa_env: ci,b2b
            build_type: csr
            cache_key: ci-b2b
            name: B2B CSR
          - spa_env: ci,b2c
            build_type: ssr
            cache_key: ci-b2c
            name: B2C SSR
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Node and Cache
        uses: ./.github/actions/setup-node-and-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key: ${{ github.event.pull_request.base.sha }}
      - name: Restore built libraries
        uses: ./.github/actions/restore-built-libraries
        with:
          cache-key: ${{ github.event.pull_request.head.sha || github.run_id }}
          fail-on-cache-miss: true
      - name: Build Spartacus app for ${{ matrix.spa_env }} (${{ matrix.build_type }})
        env:
          SPA_ENV: ${{ matrix.spa_env }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          source ci-scripts/npm-commands.sh
          echo "Building ${{ matrix.build_type }} app for SPA_ENV: ${{ matrix.spa_env }}"
          if [ "${{ matrix.build_type }}" == "ssr" ]; then
            build_ssr
          else
            build_csr
          fi
      - name: Cache built app (${{ matrix.spa_env }}-${{ matrix.build_type }})
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 #v4.3.0
        with:
          path: |
            dist/storefrontapp
          key: spartacus-app-${{ matrix.cache_key }}-${{ matrix.build_type }}-${{ github.event.pull_request.head.sha || github.run_id }}
  b2c_e2e_tests:
    needs: [detect_changes, no_retries, validate_e2e_execution, build_apps]
    name: MC - E2E B2C core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [1, 2, 3, 4, 5]
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' && needs.detect_changes.outputs.RUN_E2E_BY_CHANGES == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: E2E Test Setup
        uses: ./.github/actions/e2e-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key-base: ${{ github.event.pull_request.base.sha }}
          libs-cache-key: ${{ github.event.pull_request.head.sha || github.run_id }}
          app-cache-key: ci-b2c-csr-${{ github.event.pull_request.head.sha || github.run_id }}
      - name: Run e2es
        env:
          SPA_ENV: ci,b2c
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: ci-scripts/e2e-cypress.sh --skip-build
  b2c_ssr_e2e_tests:
    needs: [detect_changes, no_retries, validate_e2e_execution, build_apps]
    name: MC - E2E SSR core (B2C)
    runs-on: ubuntu-latest
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' && needs.detect_changes.outputs.RUN_E2E_BY_CHANGES == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: E2E Test Setup
        uses: ./.github/actions/e2e-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key-base: ${{ github.event.pull_request.base.sha }}
          libs-cache-key: ${{ github.event.pull_request.head.sha || github.run_id }}
          app-cache-key: ci-b2c-ssr-${{ github.event.pull_request.head.sha || github.run_id }}
      - name: Run e2es
        env:
          SPA_ENV: ci,b2c
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: ci-scripts/e2e-cypress.sh --skip-build --ssr
  b2b_e2e_tests:
    needs: [detect_changes, no_retries, validate_e2e_execution, build_apps]
    name: MC - E2E B2B core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [1, 2, 3, 4]
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' && needs.detect_changes.outputs.RUN_E2E_BY_CHANGES == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: E2E Test Setup
        uses: ./.github/actions/e2e-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key-base: ${{ github.event.pull_request.base.sha }}
          libs-cache-key: ${{ github.event.pull_request.head.sha || github.run_id }}
          app-cache-key: ci-b2b-csr-${{ github.event.pull_request.head.sha || github.run_id }}
      - name: Run e2es
        env:
          SPA_ENV: ci,b2b
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: ci-scripts/e2e-cypress.sh -s b2b --skip-build
  a11y_e2e_tests:
    needs: [detect_changes, no_retries, validate_e2e_execution, build_apps]
    name: MC - E2E A11Y
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [1, 2, 3]
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' && needs.detect_changes.outputs.RUN_E2E_BY_CHANGES == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: E2E Test Setup
        uses: ./.github/actions/e2e-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-key-base: ${{ github.event.pull_request.base.sha }}
          libs-cache-key: ${{ github.event.pull_request.head.sha || github.run_id }}
          app-cache-key: ci-b2c-csr-${{ github.event.pull_request.head.sha || github.run_id }}
      - name: Run e2es
        env:
          SPA_ENV: ci
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
          GITHUB_MATRIX_CONTAINER: ${{ matrix.containers }}
          GITHUB_MATRIX_TOTAL: ${{ strategy.job-total }}
          CYPRESS_ENABLE_SCREENSHOTS: true
        run: ci-scripts/e2e-cypress.sh -s a11y --skip-build
      - name: Collect screenshots
        if: always()
        uses: ./.github/actions/collect-e2e-screenshots
        with:
          test-suite: a11y
          container-id: ${{ matrix.containers }}
  notify_e2e_failures:
    needs: [b2c_e2e_tests, b2c_ssr_e2e_tests, b2b_e2e_tests, a11y_e2e_tests]
    name: MC - Notify E2E Failures
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      # Currently only A11Y screenshots are collected, but this can be extended
      # to merge screenshots from other test suites (B2C, B2B, etc.) as needed
      - name: Merge A11Y screenshots
        uses: ./.github/actions/merge-e2e-screenshots
        with:
          test-suite: a11y
          total-containers: 3
        if: ${{ needs.a11y_e2e_tests.result != 'skipped' }}
      - name: Post PR comment with screenshot details
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7.1.0
        if: ${{ github.event_name == 'pull_request' && needs.a11y_e2e_tests.result == 'failure' }}
        with:
          script: |
            const postScreenshotComment = require('./ci-scripts/post-screenshot-comment.js');
            await postScreenshotComment(github, context);
  merge_checks_result:
    needs: [build_libs, build_apps, b2c_e2e_tests, b2c_ssr_e2e_tests, b2b_e2e_tests, a11y_e2e_tests, notify_e2e_failures]
    name: MC - Result
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Aggregate Required Job Results
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7.1.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `# Merge Checks Failed
                Please push a commit to re-trigger the build.
                To push an empty commit you can use \`git commit --allow-empty -m "Trigger Build"\``
            })
            core.setFailed('Please push a commit to re-trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: |
          needs.build_libs.result == 'failure' || needs.build_libs.result == 'cancelled' ||
          needs.build_apps.result == 'failure' || needs.build_apps.result == 'cancelled' ||
          needs.b2c_e2e_tests.result == 'failure' || needs.b2c_e2e_tests.result == 'cancelled' ||
          needs.b2c_ssr_e2e_tests.result == 'failure' || needs.b2c_ssr_e2e_tests.result == 'cancelled' ||
          needs.b2b_e2e_tests.result == 'failure' || needs.b2b_e2e_tests.result == 'cancelled' ||
          needs.a11y_e2e_tests.result == 'failure' || needs.a11y_e2e_tests.result == 'cancelled'
