on:
  pull_request:
    types: [ready_for_review]
    branches:
      - develop
      - develop-*
      - release/*
    paths-ignore:
      - '**.md'
      - 'docs/**'

  workflow_dispatch:
    # empty as it is used only to manually trigger the workflow

env:
  CYPRESS_KEY: ${{ secrets.CYPRESS_KEY }}
  GH_TOKEN: ${{ github.token }}
  NODE_VERSION: '20'
  CONTINUUM_REGISTRY_TOKEN: ${{ secrets.CONTINUUM_REGISTRY_TOKEN }}
  COMMON_SAP_ARTIFACTORY_TOKEN: ${{ secrets.COMMON_SAP_ARTIFACTORY_TOKEN }}

concurrency:
  group: ci-merge-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

name: Merge Checks
jobs:
  no_retries:
    name: MC - Prevent retries
    # E2Es can't be retried.  Moreover, in some retry cases, they don't run
    # and the job returns a success code.
    runs-on: ubuntu-latest
    steps:
      - name: Forcefully fail build if jobs are all retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
  validate_e2e_execution:
    name: MC - Confirm e2es should run
    runs-on: ubuntu-latest
    outputs:
      SHOULD_RUN_E2E: ${{ steps.save-e2e-output-result.outputs.SHOULD_RUN_E2E }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether to run e2es
        id: save-e2e-output-result
        run: |
          source ci-scripts/validate-e2e-execution.sh
          echo "::set-output name=SHOULD_RUN_E2E::$(echo $RUN_E2E)"
  build_libs:
    needs: [no_retries, validate_e2e_execution]
    name: MC - Build Spartacus libraries
    runs-on: ubuntu-latest
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}
      - name: Package installation
        run: |
          npm ci
          (cd projects/storefrontapp-e2e-cypress && npm ci)
      - name: Build Spartacus libraries
        run: |
          export NODE_OPTIONS=--dns-result-order=ipv4first
          npm run build:libs 2>&1 | tee build.log

          results=$(grep "Warning: Can't resolve all parameters for" build.log || true)
          if [[ -z "${results}" ]]; then
            echo "Success: Spartacus production build was successful."
            rm build.log
          else
            echo "ERROR: Spartacus production build failed."
            echo "Check for 'Warning: Can't resolve all parameters for ...' in the build log."
            rm build.log
            exit 1
          fi
      - name: Cache built libraries
        uses: actions/cache@v4
        with:
          path: |
            dist
          key: spartacus-libs-${{ github.event.pull_request.head.sha || github.run_id }}
  b2c_e2e_tests:
    needs: [no_retries, validate_e2e_execution, build_libs]
    name: MC - E2E B2C core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [1, 2, 3, 4, 5]
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - name: Forcefully fail build if e2e job is retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}
      - name: Restore built libraries
        uses: actions/cache@v4
        with:
          path: |
            dist
          key: spartacus-libs-${{ github.event.pull_request.head.sha || github.run_id }}
          fail-on-cache-miss: true
      - name: Run e2es
        env:
          SPA_ENV: ci,b2c
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: |
          ci-scripts/e2e-cypress.sh --skip-libs-build
  b2c_ssr_e2e_tests:
    needs: [no_retries, validate_e2e_execution, build_libs]
    name: MC - E2E SSR core (B2C)
    runs-on: ubuntu-latest
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - name: Forcefully fail build if e2e job is retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}
      - name: Restore built libraries
        uses: actions/cache@v4
        with:
          path: |
            dist
          key: spartacus-libs-${{ github.event.pull_request.head.sha || github.run_id }}
          fail-on-cache-miss: true
      - name: Run e2es
        env:
          SPA_ENV: ci,b2c
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: |
          ci-scripts/e2e-cypress.sh --ssr --skip-libs-build
  b2b_e2e_tests:
    needs: [no_retries, validate_e2e_execution, build_libs]
    name: MC - E2E B2B core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [1, 2, 3, 4]
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - name: Forcefully fail build if e2e job is retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}
      - name: Restore built libraries
        uses: actions/cache@v4
        with:
          path: |
            dist
          key: spartacus-libs-${{ github.event.pull_request.head.sha || github.run_id }}
          fail-on-cache-miss: true
      - name: Run e2es
        env:
          SPA_ENV: ci,b2b
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: |
          ci-scripts/e2e-cypress.sh -s b2b --skip-libs-build
  a11y_e2e_tests:
    needs: [no_retries, validate_e2e_execution, build_libs]
    name: MC - E2E A11Y
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [1, 2, 3]
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - name: Forcefully fail build if e2e job is retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}
      - name: Restore built libraries
        uses: actions/cache@v4
        with:
          path: |
            dist
          key: spartacus-libs-${{ github.event.pull_request.head.sha || github.run_id }}
          fail-on-cache-miss: true
      - name: Run e2es
        env:
          SPA_ENV: ci
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
          GITHUB_MATRIX_CONTAINER: ${{ matrix.containers }}
          GITHUB_MATRIX_TOTAL: ${{ strategy.job-total }}
        run: |
          ci-scripts/e2e-cypress.sh -s a11y --skip-libs-build
  merge_checks_result:
    needs: [build_libs, b2c_e2e_tests, b2c_ssr_e2e_tests, b2b_e2e_tests, a11y_e2e_tests]
    name: MC - Result
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Aggregate Required Job Results
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `# Merge Checks Failed
                Please push a commit to re-trigger the build.
                To push an empty commit you can use \`git commit --allow-empty -m "Trigger Build"\``
            })
            core.setFailed('Please push a commit to re-trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: |
          needs.build_libs.result == 'failure' || needs.build_libs.result == 'cancelled' ||
          needs.b2c_e2e_tests.result == 'failure' || needs.b2c_e2e_tests.result == 'cancelled' ||
          needs.b2c_ssr_e2e_tests.result == 'failure' || needs.b2c_ssr_e2e_tests.result == 'cancelled' ||
          needs.b2b_e2e_tests.result == 'failure' || needs.b2b_e2e_tests.result == 'cancelled' ||
          needs.a11y_e2e_tests.result == 'failure' || needs.a11y_e2e_tests.result == 'cancelled'
