on:
  pull_request:
    types: [ready_for_review]
    branches:
      - develop
      - develop-*
      - release/*
    paths-ignore:
      - '**.md'
      - 'docs/**'

  workflow_dispatch:
    # empty as it is used only to manually trigger the workflow

env:
  CYPRESS_KEY: ${{ secrets.CYPRESS_KEY }}
  GH_TOKEN: ${{ github.token }}
  NODE_VERSION: '20'
  CONTINUUM_REGISTRY_TOKEN: ${{ secrets.CONTINUUM_REGISTRY_TOKEN }}
  COMMON_SAP_ARTIFACTORY_TOKEN: ${{ secrets.COMMON_SAP_ARTIFACTORY_TOKEN }}

concurrency:
  group: ci-merge-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

name: Merge Checks
jobs:
  no_retries:
    name: MC - Prevent retries
    # E2Es can't be retried.  Moreover, in some retry cases, they don't run
    # and the job returns a success code.
    runs-on: ubuntu-latest
    steps:
      - name: Forcefully fail build if jobs are all retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
  validate_e2e_execution:
    name: MC - Confirm e2es should run
    runs-on: ubuntu-latest
    outputs:
      SHOULD_RUN_E2E: ${{ steps.save-e2e-output-result.outputs.SHOULD_RUN_E2E }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether to run e2es
        id: save-e2e-output-result
        run: |
          source ci-scripts/validate-e2e-execution.sh
          echo "::set-output name=SHOULD_RUN_E2E::$(echo $RUN_E2E)"
  b2c_e2e_tests:
    needs: [no_retries, validate_e2e_execution]
    name: MC - E2E B2C core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [1, 2, 3, 4, 5]
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - name: Forcefully fail build if e2e job is retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}
      - name: Run e2es
        env:
          SPA_ENV: ci,b2c
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: |
          ci-scripts/e2e-cypress.sh
  b2c_ssr_e2e_tests:
    needs: [no_retries, validate_e2e_execution]
    name: MC - E2E SSR core (B2C)
    runs-on: ubuntu-latest
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - name: Forcefully fail build if e2e job is retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}
      - name: Run e2es
        env:
          SPA_ENV: ci,b2c
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: |
          ci-scripts/e2e-cypress.sh --ssr
  b2b_e2e_tests:
    needs: [no_retries, validate_e2e_execution]
    name: MC - E2E B2B core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [1, 2, 3, 4]
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - name: Forcefully fail build if e2e job is retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}
      - name: Run e2es
        env:
          SPA_ENV: ci,b2b
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: |
          ci-scripts/e2e-cypress.sh -s b2b
  a11y_e2e_tests:
    needs: [no_retries, validate_e2e_execution]
    name: MC - E2E A11Y
    runs-on: ubuntu-latest
    strategy:
      matrix:
        containers: [1, 2, 3]
    if: ${{ needs.validate_e2e_execution.outputs.SHOULD_RUN_E2E == 'true' }}
    steps:
      - name: Forcefully fail build if e2e job is retried
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Please push a commit to trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: ${{ github.run_attempt > 1 }}
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}
      - name: Run e2es
        env:
          SPA_ENV: ci
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
          GITHUB_MATRIX_CONTAINER: ${{ matrix.containers }}
          GITHUB_MATRIX_TOTAL: ${{ strategy.job-total }}
        run: |
          ci-scripts/e2e-cypress.sh -s a11y
      - name: Compress Cypress Screenshots
        if: failure()
        run: |
          ci-scripts/compress-cypress-screenshots.sh
      - name: Upload Cypress failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-failure-screenshots-${{ matrix.containers }}
          path: projects/storefrontapp-e2e-cypress/cypress/screenshots
          if-no-files-found: ignore
          compression-level: 0
  merge_checks_result:
    needs: [b2c_e2e_tests, b2c_ssr_e2e_tests, b2b_e2e_tests, a11y_e2e_tests]
    name: MC - Result
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Aggregate Required Job Results
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `# Merge Checks Failed
                Please push a commit to re-trigger the build.
                To push an empty commit you can use \`git commit --allow-empty -m "Trigger Build"\``
            })
            core.setFailed('Please push a commit to re-trigger the build. To push an empty commit you can use `git commit --allow-empty -m "Trigger Build"`')
        if: |
          needs.b2c_e2e_tests.result == 'failure' || needs.b2c_e2e_tests.result == 'cancelled' ||
          needs.b2c_ssr_e2e_tests.result == 'failure' || needs.b2c_ssr_e2e_tests.result == 'cancelled' ||
          needs.b2b_e2e_tests.result == 'failure' || needs.b2b_e2e_tests.result == 'cancelled' ||
          needs.a11y_e2e_tests.result == 'failure' || needs.a11y_e2e_tests.result == 'cancelled'

  post_a11y_screenshots:
    needs: [a11y_e2e_tests]
    name: MC - Post A11Y Screenshots
    runs-on: ubuntu-latest
    if: ${{ always() && needs.a11y_e2e_tests.result == 'failure' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all a11y screenshot artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: a11y-failure-screenshots-*
          path: ./screenshots
          merge-multiple: true

      - name: Generate and post A11Y comment
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            try {
              // Run the simplified script to generate comment content
              const output = execSync('node ci-scripts/post-a11y-screenshots.js', {
                encoding: 'utf8',
                cwd: process.cwd()
              });

              // Extract the comment body from the script output
              const lines = output.split('\n');
              const startIndex = lines.findIndex(line => line === 'COMMENT_BODY<<EOF');
              const endIndex = lines.findIndex(line => line === 'EOF');

              if (startIndex === -1 || endIndex === -1) {
                console.log('No comment body generated - no screenshots found');
                return;
              }

              const commentBody = lines.slice(startIndex + 1, endIndex).join('\n');

              // Post the comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });

              console.log('Posted A11Y screenshot comment successfully');

            } catch (error) {
              if (error.stdout && error.stdout.includes('No screenshots found')) {
                console.log('No screenshots found - skipping comment');
              } else {
                console.error('Error generating A11Y comment:', error.message);
                throw error;
              }
            }
