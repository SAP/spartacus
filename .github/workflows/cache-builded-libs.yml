on:
  push:
    branches:
      - develop
      - develop-*
      - 'epic/**'
      - release/*
    paths-ignore:
      - '**.md'
      - 'docs/**'
name: Cache libs (dist)
permissions:
  contents: read
  actions: write
jobs:
  cacheBuildedLibs:
    name: Builded libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.2
      - name: Cache builded libs
        uses: ./.github/cache-builded-libs
