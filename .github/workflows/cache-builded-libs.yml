on:
  push:
    branches:
      - develop
      - develop-*
      - 'epic/**'
      - release/*
    paths-ignore:
      - '**.md'
      - 'docs/**'
name: Cache libs (dist)
jobs:
  cacheBuildedLibs:
    name: Builded libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Cache builded libs
        uses: ./.github/cache-builded-libs
