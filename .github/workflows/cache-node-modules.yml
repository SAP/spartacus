on:
  push:
    branches:
      - develop
      - develop-*
      - 'epic/**'
      - release/*
name: Cache node modules

env:
  NODE_VERSION: '20'
  CONTINUUM_REGISTRY_TOKEN: ${{ secrets.CONTINUUM_REGISTRY_TOKEN }}

jobs:
  detect_changes:
    name: Cache node modules - Detect changes
    runs-on: ubuntu-latest
    outputs:
      RUN_CHECKS: ${{ steps.detect_code_changes.outputs.RUN_CHECKS }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect code changes
        id: detect_code_changes
        uses: ./.github/actions/detect-changes

  cacheNodeModules:   
    needs: [detect_changes]
    name: Cache node_modules
    runs-on: ubuntu-latest
    if: ${{ needs.detect_changes.outputs.RUN_CHECKS == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Installing root dependencies
        run: npm ci
      - name: Installing cypress dependencies
        working-directory: projects/storefrontapp-e2e-cypress
        run: npm ci
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: | 
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.sha }}
