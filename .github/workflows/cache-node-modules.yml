on:
  push:
    branches:
      - develop
      - develop-*
      - 'epic/**'
      - release/*
name: Cache node modules

permissions:
  contents: read
  actions: write

env:
  NODE_VERSION: '22'
  CONTINUUM_REGISTRY_TOKEN: ${{ secrets.CONTINUUM_REGISTRY_TOKEN }}

jobs:
  detect_changes:
    name: Cache node modules - Detect changes
    runs-on: ubuntu-latest
    outputs:
      RUN_CHECKS: ${{ steps.detect_code_changes.outputs.RUN_CHECKS }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Detect code changes
        id: detect_code_changes
        uses: ./.github/actions/detect-changes

  cacheNodeModules:   
    needs: [detect_changes]
    name: Cache node_modules
    runs-on: ubuntu-latest
    if: ${{ needs.detect_changes.outputs.RUN_CHECKS == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup node
        id: setup-node
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Installing root dependencies
        run: npm ci
      - name: Installing cypress dependencies
        working-directory: projects/storefrontapp-e2e-cypress
        run: npm ci
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: | 
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-node${{ env.NODE_VERSION }}-npm${{ steps.setup-node.outputs.npm-version }}-${{ github.sha }}-${{ hashFiles('**/package-lock.json') }}
