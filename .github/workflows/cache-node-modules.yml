on:
  push:
    branches:
      - develop
      - develop-*
      - 'epic/**'
      - release/*
name: Cache node modules

permissions:
  contents: read
  actions: write

env:
  NODE_VERSION: '20'
  CONTINUUM_REGISTRY_TOKEN: ${{ secrets.CONTINUUM_REGISTRY_TOKEN }}

jobs:
  detect_changes:
    name: Cache node modules - Detect changes
    runs-on: ubuntu-latest
    outputs:
      RUN_CHECKS: ${{ steps.detect_code_changes.outputs.RUN_CHECKS }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Detect code changes
        id: detect_code_changes
        uses: ./.github/actions/detect-changes

  cacheNodeModules:   
    needs: [detect_changes]
    name: Cache node_modules
    runs-on: ubuntu-latest
    if: ${{ needs.detect_changes.outputs.RUN_CHECKS == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Installing root dependencies
        run: npm ci
      - name: Installing cypress dependencies
        working-directory: projects/storefrontapp-e2e-cypress
        run: npm ci
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: | 
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.sha }}
