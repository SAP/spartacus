name: Feature Toggles Check

on:
  schedule:
    # Run on the 5th of each month at 9:00 AM UTC
    - cron: "0 9 5 * *"
  workflow_dispatch:
    # Allow manual triggering for testing

permissions:
  contents: read
  
env:
  NODE_VERSION: "20"

jobs:
  feature_toggle_check:
    name: Check Feature Toggles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Feature Toggles Check
        id: toggle-check
        run: |
          set +e
          output=$(ci-scripts/check-feature-toggles.sh)
          exit_code=$?

          echo "script_output<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

          # Extract counts for summary
          toggles_to_remove=$(echo "$output" | grep "Toggles to remove:" | grep -o '[0-9]\+' || echo "0")
          toggles_to_enable=$(echo "$output" | grep "Toggles to enable:" | grep -o '[0-9]\+' || echo "0")
          echo "toggles_to_remove=$toggles_to_remove" >> $GITHUB_OUTPUT
          echo "toggles_to_enable=$toggles_to_enable" >> $GITHUB_OUTPUT

          # Extract specific toggle names for Slack message - format each on separate line
          toggles_to_remove_raw=$(echo "$output" | sed -n '/🗑️  TOGGLES TO REMOVE/,/⚡ TOGGLES TO ENABLE/p' | grep "^[a-zA-Z]" | grep -v "^Toggle" | awk '{print $1}' | head -10)
          toggles_to_enable_raw=$(echo "$output" | sed -n '/⚡ TOGGLES TO ENABLE/,/📋 SUMMARY/p' | grep "^[a-zA-Z]" | grep -v "^Toggle" | awk '{print $1}' | head -10)

          # Format with bullet points and proper line breaks
          toggles_to_remove_list=""
          while read -r toggle; do
            [ -n "$toggle" ] && toggles_to_remove_list="${toggles_to_remove_list}• ${toggle}\n"
          done <<< "$toggles_to_remove_raw"
          [ -z "$toggles_to_remove_list" ] && toggles_to_remove_list="None"

          toggles_to_enable_list=""
          while read -r toggle; do
            [ -n "$toggle" ] && toggles_to_enable_list="${toggles_to_enable_list}• ${toggle}\n"
          done <<< "$toggles_to_enable_raw"
          [ -z "$toggles_to_enable_list" ] && toggles_to_enable_list="None"

          echo "toggles_to_remove_list<<EOF" >> $GITHUB_OUTPUT
          echo "$toggles_to_remove_list" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "toggles_to_enable_list<<EOF" >> $GITHUB_OUTPUT
          echo "$toggles_to_enable_list" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Display the results in GitHub Actions logs
          echo "::group::Feature Toggle Check Results"
          echo "$output"
          echo "::endgroup::"

          if [ $exit_code -ne 0 ]; then
            echo "::warning::Feature toggles require maintenance - see details below"
          else
            echo "::notice::All feature toggles are compliant!"
          fi

      - name: Prepare Slack User ID
        if: steps.toggle-check.outputs.exit_code != '0'
        id: slack-user
        run: |
          # Clean up the user ID (remove any whitespace/newlines)
          USER_ID=$(echo '${{ secrets.SLACK_TOGGLE_REVIEWER_ID }}' | tr -d '[:space:]')
          echo "user_id=$USER_ID" >> $GITHUB_OUTPUT
          echo "Cleaned user ID prepared for Slack mention"

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a #v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          payload: |
            channel: ${{ secrets.FEATURE_TOGGLE_SLACK_NOTIFICATION_CHANNEL }}
            text: "Feature Toggles Check"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":warning: *Feature Toggles Check :warning:*\n\n<@${{ steps.slack-user.outputs.user_id }}> Feature toggles require maintenance:"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Toggles to Remove (${{ steps.toggle-check.outputs.toggles_to_remove }}):*\n${{ steps.toggle-check.outputs.toggles_to_remove_list }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Toggles to Enable (${{ steps.toggle-check.outputs.toggles_to_enable }}):*\n${{ steps.toggle-check.outputs.toggles_to_enable_list }}"
              - type: "divider"
              - type: "actions"
                elements:
                  - type: "button"
                    text:
                      type: "plain_text"
                      text: "Edit Feature Toggles"
                      emoji: true
                    value: "edit_toggles"
                    url: "${{ github.server_url }}/${{ github.repository }}/edit/${{ github.ref_name }}/projects/core/src/features-config/feature-toggles/config/feature-toggles.ts"
        if: steps.toggle-check.outputs.exit_code != '0'
