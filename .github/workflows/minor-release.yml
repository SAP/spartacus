name: Release snapshot (creates a snapshot from the develop branch or from the input-provided source)

permissions:
  contents: write
  pull-requests: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to release from. Could be any branch or tag (e.g., release/2211.20.x, 2211.20.0). By default, the develop branch is used.'
        required: false
      version:
        description: 'Release version (e.g., 2211.20.0 or 2211.20.0-1)'
        required: true
      create_pr:
        description: 'Create a PR from the release branch to the source branch?'
        required: false
        type: 'boolean'
        default: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.source || 'develop' }}

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com' 

      - name: Validate Version
        uses: ./.github/actions/validate-version
        with:
          version: ${{ github.event.inputs.version }}

      - name: Set Version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "version=$INPUT_VERSION" >> $GITHUB_ENV

      - name: Create Release Branch
        env:
          VERSION: ${{ env.version }}
        run: |
          version="$VERSION"
          if [[ $version == *-* ]]; then
            IFS='-' read -ra VERSION_AND_PRERELEASE <<< "$version"
            prerelease="${VERSION_AND_PRERELEASE[*]:1}"
            version_part=${VERSION_AND_PRERELEASE[0]}
          else
            version_part=$version
            prerelease=""
          fi
          
          IFS='.' read -ra ADDR <<< "$version_part"
          echo "major=${ADDR[0]}" >> $GITHUB_ENV
          echo "minor=${ADDR[1]}" >> $GITHUB_ENV
          echo "patch=${ADDR[2]}" >> $GITHUB_ENV
          release_branch="release-${ADDR[0]}.${ADDR[1]}.${ADDR[2]}"
          
          if [[ -n $prerelease ]]; then
            release_branch="${release_branch}-${prerelease// /-}"
          fi

          echo "RELEASE_BRANCH=$release_branch" >> $GITHUB_ENV

          echo "Checking for existence of the branch: $release_branch"

          if git ls-remote --heads origin "$release_branch" | grep -q "$release_branch"; then
            echo "Error: Branch $release_branch already exists. Please check the branch before proceeding."
            exit 1
          fi

          git checkout -b $release_branch

      - name: Update SCSS Versioning
        env:
          MAJOR: ${{ env.major }}
          MINOR: ${{ env.minor }}
          PATCH: ${{ env.patch }}
        run: |
          major="$MAJOR"
          minor="$MINOR"
          patch="$PATCH"
          sed -i "s/major: [0-9]\\{1,\\},/major: $major,/" core-libs/styles/scss/_versioning.scss
          sed -i "s/minor: [0-9]\\{1,\\},/minor: $minor,/" core-libs/styles/scss/_versioning.scss
          sed -i "s/patch: [0-9]\\{1,\\},/patch: $patch,/" core-libs/styles/scss/_versioning.scss
          echo "Updated versions in core-libs/styles/scss/_versioning.scss."

      - name: Update Publishing Version
        env:
          VERSION: ${{ env.version }}
        run: |
          version="$VERSION"
          sed -i "s/export const PUBLISHING_VERSION = '.*';/export const PUBLISHING_VERSION = '$version';/" ./tools/config/const.ts
          echo "Updated PUBLISHING_VERSION in ./tools/config/const.ts."
      

      - name: Package installation
        run: npm ci
        
      - name: Run Config Update
        run: |
          if ! npm run config:update; then
            echo "Error: The configuration file is not up to date. Regenerating dependencies..."
            npm run generate:deps
            npm run config:update
          fi
          npm run generate:deps

      - name: Run Schematics Tests
        run: |
          npm run test:all-schematics

      - name: Push Changes
        env:
          VERSION: ${{ env.version }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
        run: |
          git add .
          git commit -m "Release $VERSION"
          git push origin "$RELEASE_BRANCH"

      - name: Tag the release
        env:
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
          VERSION: ${{ env.version }}
        run: |
          git fetch origin "$RELEASE_BRANCH"
          git checkout "$RELEASE_BRANCH"

          TAG="$VERSION"

          # Check if tag already exists
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping creation."
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          fi

      - name: Sync branch to a private repo
        env:
          GH_TOKEN: ${{ secrets.GH_TEMPORARY_TOKEN }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Triggering repo-sync.yml with branch: $RELEASE_BRANCH"

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/repo-sync.yml/dispatches" \
            -d "{\"ref\":\"${RELEASE_BRANCH}\",\"inputs\":{\"branch_to_sync\":\"${RELEASE_BRANCH}\"}}"

      - name: Create Pull Request to develop
        if: ${{ github.event.inputs.create_pr == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TEMPORARY_TOKEN }}
          RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
          SOURCE_BRANCH: ${{ github.event.inputs.source }}
          VERSION: ${{ env.version }}
        run: |
          echo "Creating pull request from $RELEASE_BRANCH to $SOURCE_BRANCH..."

          # Check if a PR already exists
          existing_pr=$(gh pr list --head "$RELEASE_BRANCH" --base "$SOURCE_BRANCH" --json number --jq '.[].number')
          if [[ -n "$existing_pr" ]]; then
            echo "PR already exists: #$existing_pr"
          else
            gh pr create \
              --head "$RELEASE_BRANCH" \
              --base "$SOURCE_BRANCH" \
              --title "chore(release): $VERSION" \
              --body "Automated PR to merge release changes back into the source branch."
          fi
