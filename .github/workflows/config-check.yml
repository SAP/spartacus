on:
  pull_request:
    types: [opened, synchronize, reopened]

name: Config check

permissions:
  contents: read
  actions: write
  
jobs:
  detect_changes:
    name: Config check - Detect changes
    runs-on: ubuntu-latest
    outputs:
      RUN_CHECKS: ${{ steps.detect_code_changes.outputs.RUN_CHECKS }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Detect code changes
        id: detect_code_changes
        uses: ./.github/actions/detect-changes

  configCheck:
    needs: [detect_changes]
    name: Dependencies and tsconfig files
    runs-on: ubuntu-latest
    if: ${{ needs.detect_changes.outputs.RUN_CHECKS == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fetch the base branch so the config check can diff `package.json`
          # dependency fields against it (see check-lock-files.ts).
          fetch-depth: 0
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-node
        with:
          node-version: '22'
      - name: NPM
        run: npm ci
      - name: Get changed files
        id: changed_files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          result-encoding: string
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // The lock checker only consumes manifests and lock files. Passing
            // the full PR diff can exceed the per-variable OS environment limit.
            return files
              .map((file) => file.filename)
              .filter((filename) => /(^|\/)package(-lock)?\.json$/.test(filename))
              .join('\n');
      - name: Check configurations
        run: npm run config:check
        env:
          FORCE_COLOR: 2 # Support colors from chalk
          CHANGED_FILES: ${{ steps.changed_files.outputs.result }}
          # Base revision the PR targets, used to diff dependency fields.
          BASE_REF: ${{ github.event.pull_request.base.sha }}
