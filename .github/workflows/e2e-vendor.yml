  build_conclusion:
    needs: [cdc_b2c_e2e_tests, cdc_b2b_e2e_tests, cdp_b2c_e2e_tests, segment_refs_e2e_tests, digital_payments_e2e_tests, opps_e2e_tests, s4_service_e2e_tests, epd_visualization_e2e_tests, cds_e2e_tests, asm_e2e_tests, product_configurator_e2e_tests, pdf_invoices_e2e_tests, cpq_e2e_tests, omf_e2e_tests, opf_e2e_tests, s4om_e2e_tests, estimated_delivery_date_e2e_tests, pickup_in_store_e2e_tests, requested-delivery-date_e2e_tests]
    name: Build Conclusion
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Required build failed
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Build failed')
        if: |
          needs.cdc_b2c_e2e_tests.result == 'failure' || needs.cdc_b2c_e2e_tests.result == 'cancelled' ||
          needs.cdc_b2b_e2e_tests.result == 'failure' || needs.cdc_b2b_e2e_tests.result == 'cancelled' ||
          needs.cdp_b2c_e2e_tests.result == 'failure' || needs.cdp_b2c_e2e_tests.result == 'cancelled' ||
          needs.segment_refs_e2e_tests.result == 'failure' || needs.segment_refs_e2e_tests.result == 'cancelled' ||
          needs.digital_payments_e2e_tests.result == 'failure' || needs.digital_payments_e2e_tests.result == 'cancelled' ||
          needs.opps_e2e_tests.result == 'failure' || needs.opps_e2e_tests.result == 'cancelled' ||
          needs.s4_service_e2e_tests.result == 'failure' || needs.s4_service_e2e_tests.result == 'cancelled' ||
          needs.epd_visualization_e2e_tests.result == 'failure' || needs.epd_visualization_e2e_tests.result == 'cancelled' ||
          needs.cds_e2e_tests.result == 'failure' || needs.cds_e2e_tests.result == 'cancelled' ||
          needs.asm_e2e_tests.result == 'failure' || needs.asm_e2e_tests.result == 'cancelled' ||
          needs.product_configurator_e2e_tests.result == 'failure' || needs.product_configurator_e2e_tests.result == 'cancelled' ||
          needs.pdf_invoices_e2e_tests.result == 'failure' || needs.pdf_invoices_e2e_tests.result == 'cancelled' ||
          needs.cpq_e2e_tests.result == 'failure' || needs.cpq_e2e_tests.result == 'cancelled' ||
          needs.omf_e2e_tests.result == 'failure' || needs.omf_e2e_tests.result == 'cancelled' ||
          needs.opf_e2e_tests.result == 'failure' || needs.opf_e2e_tests.result == 'cancelled' ||
          needs.s4om_e2e_tests.result == 'failure' || needs.s4om_e2e_tests.result == 'cancelled' ||
          needs.estimated_delivery_date_e2e_tests.result == 'failure' || needs.estimated_delivery_date_e2e_tests.result == 'cancelled' ||
          needs.pickup_in_store_e2e_tests.result == 'failure' || needs.pickup_in_store_e2e_tests.result == 'cancelled' ||
          needs.requested_delivery_date_e2e_tests.result == 'failure' || needs.requested_delivery_date_e2e_tests.result == 'cancelled'
  send_slack_message:
    needs: build_conclusion
    name: Slack message for failed CI build in Spartacus
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - run: |
          echo "Context Info:"
          echo "  Event = ${{ github.event_name }}"
          echo "  Build Result = ${{ needs.build_conclusion.result }}"
          echo "  Branch = ${{ github.ref_name }}"
          echo "  Default branch = ${{ github.event.repository.default_branch }}"
      - name: Notify the slack channel of when build conclusion failed
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
        uses: slackapi/slack-github-action@v1.27.1
        with:
          channel-id: ${{ secrets.SLACK_NOTIFICATION_CHANNEL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":nuclear-bomb: :fireduck: *Vendor E2E Tests Failed*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Failed build",
                        "emoji": true
                      },
                      "value": "failed_build",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "What was committed?",
                        "emoji": true
                      },
                      "value": "recent_merged_commit",
                      "url": "${{ github.event.head_commit.url }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Build history",
                        "emoji": true
                      },
                      "value": "buid_history",
                      "url": "https://github.com/SAP/spartacus/actions/workflows/e2e-vendor.yml?query=branch%3Adevelop"
                    }
                  ]
                }
              ]
            }
        if: |
          needs.build_conclusion.result == 'failure'

