name: E2E vendor tests

on:
  schedule:
    # Runs every day at 10:00 (UTC)
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CYPRESS_KEY: ${{ secrets.CYPRESS_KEY }}
  NODE_VERSION: "20"
  CONTINUUM_REGISTRY_TOKEN: ${{ secrets.CONTINUUM_REGISTRY_TOKEN }}

jobs:
  vendor_e2e_tests:
    name: Run ${{ matrix.test_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: vendor:cdc
            spa_env: cdc,b2c
            test_name: E2E tests for cdc, b2c
          - suite: vendor:cdc-b2b
            spa_env: cdc,b2b
            test_name: E2E tests for cdc, b2b
          - suite: vendor:cdp
            spa_env: cdp,b2c
            test_name: E2E tests for cdp
          - suite: vendor:segment-refs
            spa_env: segment-refs,b2c
            test_name: E2E tests for segment refs
          - suite: vendor:digital-payments
            spa_env: digital-payments,b2c
            test_name: E2E tests for digital payments
          - suite: vendor:opps
            spa_env: opps,b2c
            test_name: E2E tests for opps
          - suite: vendor:s4-service
            spa_env: s4-service,b2b
            test_name: E2E tests for s4 service
          - suite: vendor:epd-visualization
            spa_env: epd-visualization,b2c
            test_name: E2E tests for epd visualization
          - suite: vendor:cds
            spa_env: cds,b2c
            test_name: E2E tests for cds
          - suite: vendor:asm
            spa_env: asm,b2c
            test_name: E2E tests for asm
          - suite: vendor:product-configurator
            spa_env: b2c
            test_name: E2E tests for product configuration
          - suite: vendor:pdf-invoices
            spa_env: pdf-invoices,b2b
            test_name: E2E tests for pdf invoices
          - suite: vendor:cpq
            spa_env: cpq,b2b
            test_name: E2E tests for cpq
          - suite: vendor:omf
            spa_env: omf,b2c
            test_name: E2E tests for omf
          - suite: vendor:opf
            spa_env: opf,b2c
            test_name: E2E tests for opf
          - suite: vendor:s4om
            spa_env: s4om,b2b
            test_name: E2E tests for s4om
          - suite: vendor:estimated-delivery-date
            spa_env: estimated-delivery-date,b2c
            test_name: E2E tests for estimated delivery date
          - suite: vendor:pickup-in-store
            spa_env: b2c
            test_name: E2E tests for pickup in store
          - suite: vendor:requested-delivery-date
            spa_env: requested-delivery-date,b2c
            test_name: E2E tests for requested delivery date
          - suite: vendor:punchout
            spa_env: punchout,b2b
            test_name: E2E tests for punchout

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            projects/storefrontapp-e2e-cypress/node_modules
            ~/.cache/Cypress
          key: nodemodules-${{ github.event.pull_request.base.sha }}
          restore-keys: nodemodules-${{ github.event.pull_request.base.sha }}

      - name: Run ${{ matrix.test_name }}
        env:
          SPA_ENV: ${{ matrix.spa_env }}
          BUILD_NUMBER: ci-build-number-${{ github.event.pull_request.head.sha || github.run_id }}
        run: |
          ci-scripts/e2e-cypress.sh -s ${{ matrix.suite }}
  build_conclusion:
    needs: [vendor_e2e_tests]
    name: Build Conclusion
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Required build failed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setFailed('Build failed')
        if: |
          needs.vendor_e2e_tests.result == 'failure' || needs.vendor_e2e_tests.result == 'cancelled'
  send_slack_message:
    needs: build_conclusion
    name: Slack message for failed CI build in Spartacus
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - run: |
          echo "Context Info:"
          echo "  Event = ${{ github.event_name }}"
          echo "  Build Result = ${{ needs.build_conclusion.result }}"
          echo "  Branch = ${{ github.ref_name }}"
          echo "  Default branch = ${{ github.event.repository.default_branch }}"
      - name: Notify the slack channel of when build conclusion failed
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a #v2.1.1
        with:
          channel-id: ${{ vars.SLACK_NOTIFICATION_CHANNEL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":nuclear-bomb: :fireduck: *Vendor E2E Tests Failed*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Failed build",
                        "emoji": true
                      },
                      "value": "failed_build",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "What was committed?",
                        "emoji": true
                      },
                      "value": "recent_merged_commit",
                      "url": "${{ github.event.head_commit.url }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Build history",
                        "emoji": true
                      },
                      "value": "buid_history",
                      "url": "https://github.com/SAP/spartacus/actions/workflows/e2e-vendor.yml?query=branch%3Adevelop"
                    }
                  ]
                }
              ]
            }
        if: |
          needs.build_conclusion.result == 'failure'
