on:
  pull_request:
    paths:
      - '**/assets/translations/**'
      - '**/assets/src/translations/**'

env:
  NODE_VERSION: '22'

name: Validate Configuration of Translation Files

permissions:
  contents: read

jobs:
  validate-translations:
    name: Validate Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Translation Validation Script
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          # Include deletions so remaining translation indexes are still checked.
          translation_paths=$(git diff --name-only "$BASE_COMMIT" "$HEAD_COMMIT" -- \
            '**/assets/translations/**' '**/assets/src/translations/**' \
            | sed -En 's|^(.*assets/(src/)?translations)/.*|\1|p' | sort -u)

          if [ -n "$translation_paths" ]; then
            while IFS= read -r folder_path; do
              if [ ! -d "$folder_path" ]; then
                echo "Translation folder removed: $folder_path; skipping validation"
                continue
              fi
              echo "Changes detected in $folder_path"
              sh ./ci-scripts/validate-translations.sh "$folder_path"
            done <<< "$translation_paths"
          else
            echo "No translation changes detected"
          fi
