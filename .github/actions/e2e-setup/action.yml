name: 'E2E Test Setup'
description: 'Complete setup for E2E tests including node, cache, libraries, and app restoration'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  cache-key-base:
    description: 'Base cache key for node modules'
    required: true
  libs-cache-key:
    description: 'Cache key for built libraries'
    required: true
  app-cache-key:
    description: 'Cache key for built app'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Prevent retries
      uses: ./.github/actions/prevent-retries

    - name: Setup Node and Cache
      uses: ./.github/actions/setup-node-and-cache
      with:
        node-version: ${{ inputs.node-version }}
        cache-key: ${{ inputs.cache-key-base }}

    - name: Restore built libraries
      uses: ./.github/actions/restore-built-libraries
      with:
        cache-key: ${{ inputs.libs-cache-key }}
        fail-on-cache-miss: true

    - name: Restore built app
      uses: ./.github/actions/restore-built-app
      with:
        cache-key: ${{ inputs.app-cache-key }}
        fail-on-cache-miss: true
