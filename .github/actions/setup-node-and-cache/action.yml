name: 'Setup Node and Cache'
description: 'Setup Node.js and cache node_modules and Cypress cache'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  cache-key:
    description: 'Base cache key'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Setup node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 #v4.3.0
      with:
        path: |
          node_modules
          projects/storefrontapp-e2e-cypress/node_modules
          ~/.cache/Cypress
        key: nodemodules-${{ inputs.cache-key }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: nodemodules-${{ inputs.cache-key }}-

    - name: Package installation
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
