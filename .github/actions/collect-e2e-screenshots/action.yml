name: 'Collect E2E Screenshots'
description: 'Collect screenshots from E2E test runs'
inputs:
  test-suite:
    description: 'Test suite name'
    required: true
  container-id:
    description: 'Matrix container identifier'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Upload screenshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-screenshots-${{ inputs.test-suite }}-container-${{ inputs.container-id }}
        path: projects/storefrontapp-e2e-cypress/cypress/screenshots/
        retention-days: 30
        if-no-files-found: ignore
