<ng-container *ngIf="!!media">
  <ng-container *cxFeature="'useExtendedMediaComponentConfiguration'">
    <picture
      *ngIf="
        !!media?.sources?.length && elementType !== 'img';
        else imageElementTmp
      "
    >
      <source
        *ngFor="let source of media.sources; trackBy: trackByMedia"
        [media]="source.media"
        [srcset]="source.srcset"
        [attr.width]="source.width"
        [attr.height]="source.height"
      />

      <img
        *cxFeature="'enableMediaFetchPriority'"
        [loading]="effectiveLoadingStrategy"
        [attr.fetchpriority]="fetchPriority"
        [alt]="media.alt"
        [title]="media.alt"
        [src]="media.src"
        [attr.role]="media.role"
        [attr.width]="media.width"
        [attr.height]="media.height"
        (load)="loadHandler()"
        (error)="errorHandler()"
      />
      <img
        *cxFeature="'!enableMediaFetchPriority'"
        [loading]="loading"
        [alt]="media.alt"
        [title]="media.alt"
        [src]="media.src"
        [attr.role]="media.role"
        [attr.width]="media.width"
        [attr.height]="media.height"
        (load)="loadHandler()"
        (error)="errorHandler()"
      />
    </picture>

    <ng-template #imageElementTmp>
      <ng-container *cxFeature="'enableMediaFetchPriority'">
        <img
          *ngIf="media.src"
          [loading]="effectiveLoadingStrategy"
          [attr.fetchpriority]="fetchPriority"
          [alt]="media.alt"
          [title]="media.alt"
          [src]="media.src"
          [srcset]="media.srcset || media.src"
          [attr.role]="media.role"
          [attr.width]="media.width"
          [attr.height]="media.height"
          [attr.sizes]="sizesForImgElement"
          (load)="loadHandler()"
          (error)="errorHandler()"
        />
      </ng-container>
      <ng-container *cxFeature="'!enableMediaFetchPriority'">
        <img
          *ngIf="media.src"
          [loading]="loading"
          [alt]="media.alt"
          [title]="media.alt"
          [src]="media.src"
          [srcset]="media.srcset || media.src"
          [attr.role]="media.role"
          [attr.width]="media.width"
          [attr.height]="media.height"
          [attr.sizes]="sizesForImgElement"
          (load)="loadHandler()"
          (error)="errorHandler()"
        />
      </ng-container>
    </ng-template>
  </ng-container>

  <ng-container *cxFeature="'!useExtendedMediaComponentConfiguration'">
    <picture *ngIf="media.srcset && !isLegacy; else legacyImgTmp">
      <source
        *ngFor="
          let source of media!.srcset! | cxMediaSources;
          trackBy: trackByMedia
        "
        [srcset]="source.srcset"
        [media]="source.media"
      />
      <img
        *cxFeature="'enableMediaFetchPriority'"
        [loading]="effectiveLoadingStrategy"
        [attr.fetchpriority]="fetchPriority"
        [alt]="media.alt"
        [title]="media.alt"
        [src]="media.src"
        [attr.role]="media.role"
        (load)="loadHandler()"
        (error)="errorHandler()"
      />
      <img
        *cxFeature="'!enableMediaFetchPriority'"
        [loading]="loading"
        [alt]="media.alt"
        [title]="media.alt"
        [src]="media.src"
        [attr.role]="media.role"
        (load)="loadHandler()"
        (error)="errorHandler()"
      />
    </picture>

    <ng-template #legacyImgTmp>
      <ng-container *cxFeature="'enableMediaFetchPriority'">
        <img
          *ngIf="media.src"
          [loading]="effectiveLoadingStrategy"
          [attr.fetchpriority]="fetchPriority"
          [alt]="media.alt"
          [title]="media.alt"
          [src]="media.src"
          [srcset]="media?.srcset || media.src"
          [attr.role]="media.role"
          (load)="loadHandler()"
          (error)="errorHandler()"
        />
      </ng-container>
      <ng-container *cxFeature="'!enableMediaFetchPriority'">
        <img
          *ngIf="media.src"
          [loading]="loading"
          [alt]="media.alt"
          [title]="media.alt"
          [src]="media.src"
          [srcset]="media?.srcset || media.src"
          [attr.role]="media.role"
          (load)="loadHandler()"
          (error)="errorHandler()"
        />
      </ng-container>
    </ng-template>
  </ng-container>
</ng-container>
