@if (!!media) {
  @if (!!media?.sources?.length && elementType !== 'img') {
    <picture>
      @for (source of media.sources; track trackByMedia($index, source)) {
        <source
          [media]="source.media"
          [srcset]="source.srcset"
          [attr.width]="source.width"
          [attr.height]="source.height"
        />
      }

      <img
        [loading]="effectiveLoadingStrategy"
        [attr.fetchpriority]="fetchPriority"
        [alt]="media.alt"
        [title]="media.alt"
        [src]="media.src"
        [attr.role]="media.role"
        [attr.width]="media.width"
        [attr.height]="media.height"
        (load)="loadHandler()"
        (error)="errorHandler()"
      />
    </picture>
  } @else {
    @if (media.src) {
      <img
        [loading]="effectiveLoadingStrategy"
        [attr.fetchpriority]="fetchPriority"
        [alt]="media.alt"
        [title]="media.alt"
        [src]="media.src"
        [srcset]="media.srcset || media.src"
        [attr.role]="media.role"
        [attr.width]="media.width"
        [attr.height]="media.height"
        [attr.sizes]="sizesForImgElement"
        (load)="loadHandler()"
        (error)="errorHandler()"
      />
    }
  }
}
