<ng-container *ngIf="isCollapsed">
  {{ text?.slice(0, maxLength) }}
</ng-container>
<ng-container *ngIf="!isCollapsed">
  {{ text }}
</ng-container>

<button
  class="btn-link"
  *ngIf="showReadMore"
  (click)="isCollapsed = !isCollapsed"
  [attr.aria-expanded]="!isCollapsed"
>
  {{ (isCollapsed ? readMoreI18nKey! : readLessI18nKey!) | cxTranslate }}
</button>
