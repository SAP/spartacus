<ng-container *ngIf="isCollapsed">
  {{ text.slice(0, maxLength) }}
</ng-container>
<ng-container *ngIf="!isCollapsed">
  {{ text }}
</ng-container>

<button
  class="btn-link"
  *ngIf="showReadMore"
  (click)="isCollapsed = !isCollapsed"
>
  {{
    (isCollapsed ? readMoreTranslation! : readLessTranslation!) | cxTranslate
  }}
</button>
