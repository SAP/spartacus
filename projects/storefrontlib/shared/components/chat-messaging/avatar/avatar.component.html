@if (message) {
  <div class="cx-avatar" [ngClass]="{ 'right-align': message.rightAlign }">
    @if (!message.rightAlign && message?.author) {
      <span>
        {{ getInitials(message?.author || '') }}
      </span>
    }

    @if (!message.rightAlign && !message?.author) {
      <cx-icon [type]="iconTypes.USER"></cx-icon>
    }

    @if (message.rightAlign) {
      <cx-icon [type]="iconTypes.HEADSET"></cx-icon>
    }
  </div>
}
