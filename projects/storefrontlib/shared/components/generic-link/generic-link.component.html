<!-- https://github.com/angular/angular/issues/24567 -->

@if (isExternalUrl()) {
  <a
    [href]="url"
    [attr.target]="target"
    [attr.rel]="rel"
    [attr.id]="id"
    [attr.class]="class"
    [attr.style]="style"
    [attr.title]="title"
    [attr.aria-label]="ariaLabel ? ariaLabel : null"
    [tabindex]="tabindex"
  >
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </a>
} @else {
  <a
    [routerLink]="routerUrl"
    [queryParams]="queryParams"
    [fragment]="fragment"
    [target]="target || undefined"
    [attr.id]="id"
    [attr.class]="class"
    [attr.style]="style"
    [attr.title]="title"
    [attr.aria-label]="ariaLabel ? ariaLabel : null"
    [tabindex]="tabindex"
  >
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </a>
}

<ng-template #content>
  <ng-content></ng-content>
</ng-template>
