<input
  class="form-control"
  type="date"
  [formControl]="control"
  [attr.min]="min"
  [attr.max]="max"
  [attr.required]="required === false ? undefined : required"
  (change)="change()"
  [placeholder]="placeholder"
  [pattern]="pattern"
  [attr.aria-invalid]="!control.untouched && control.invalid"
  [attr.aria-errormessage]="'controlError'"
/>

<cx-form-errors
  id="controlError"
  [control]="control"
  prefix="formErrors.labeled.date"
  fallbackPrefix="formErrors.date"
  [translationParams]="{
    label: label ?? '' | cxTranslate,
    max: getDate(max) | cxDate,
    min: getDate(min) | cxDate,
  }"
></cx-form-errors>
