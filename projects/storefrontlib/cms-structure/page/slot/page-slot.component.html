<ng-template
  *ngIf="position"
  [cxOutlet]="position"
  [cxOutletContext]="{ components$: components$ }"
>
  <!-- Component template -->
  <ng-template #componentTpl let-component>
    <ng-template
      *ngIf="component.flexType"
      [cxOutlet]="component.flexType"
      [cxOutletContext]="{ component: component }"
      [cxOutletDefer]="getComponentDeferOptions(component.flexType)"
      (loaded)="isLoaded($event)"
    >
      <ng-container [cxComponentWrapper]="component"></ng-container>
    </ng-template>
  </ng-template>

  <!-- Conditional rendering using either ngFor or rxFor -->
  <ng-container
    *ngIf="shouldRenderSync() | async as renderingStrategy; else asyncTemplate"
  >
    <ng-container *ngFor="let component of components">
      <ng-container
        *ngTemplateOutlet="componentTpl; context: { $implicit: component }"
      >
      </ng-container>
    </ng-container>
  </ng-container>

  <ng-template #asyncTemplate>
    <ng-container *rxFor="let component of components">
      <ng-container
        *ngTemplateOutlet="componentTpl; context: { $implicit: component }"
      >
      </ng-container>
    </ng-container>
  </ng-template>
</ng-template>
