@if ((items$ | async)?.length > 1 && (items$ | async); as items) {
  <label>
    <span>{{ label$ | async | cxTranslate }}:</span>
    <select (change)="active = $any($event).target.value">
      @for (item of items; track item; let i = $index) {
        <option
          [attr.aria-label]="ariaLabel$(item.label, i, items.length) | async"
          value="{{ item.isocode }}"
          [selected]="(activeItem$ | async) === item.isocode"
        >
          {{ item.label }}
        </option>
      }
    </select>
    <cx-icon
      aria-hidden="true"
      [type]="iconTypes.CARET_DOWN"
      class="small"
    ></cx-icon>
  </label>
}
