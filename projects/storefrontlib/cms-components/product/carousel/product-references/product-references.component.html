<ng-container *cxFeature="'productCarouselScrolling'">
  @if (items$ | async; as items) {
    @if (items.length) {
      <cx-carousel-scrolling
        [title]="title$ | async"
        [items]="items"
        [template]="carouselItem"
        [trackByFn]="trackByFn"
      >
      </cx-carousel-scrolling>
    }
  }
</ng-container>
<ng-container *cxFeature="'!productCarouselScrolling'">
  @if (items$ | async; as items) {
    @if (items$ | async; as items) {
      <cx-carousel
        [title]="title$ | async"
        [items]="items"
        [template]="carouselItem"
        [trackByFn]="trackByFn"
      >
      </cx-carousel>
    }
  }
</ng-container>

<ng-template #carouselItem let-item="item">
  <a tabindex="0" [routerLink]="{ cxRoute: 'product', params: item } | cxUrl">
    <cx-media [container]="item.images?.PRIMARY" format="product"></cx-media>
    <h4>{{ item.name }}</h4>
    <div class="price">{{ item.price?.formattedValue }}</div>
  </a>
</ng-template>
