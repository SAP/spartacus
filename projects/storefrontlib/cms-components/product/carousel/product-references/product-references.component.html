<ng-container *cxFeature="'scrollableProductCarousel'">
  <ng-container *ngIf="items$ | async as items">
    <cx-carousel-v2
      *ngIf="items.length"
      [title]="title$ | async"
      [items]="items"
      [template]="carouselItem"
      [trackByFn]="trackByFn"
    >
    </cx-carousel-v2>
  </ng-container>
</ng-container>
<ng-container *cxFeature="'!scrollableProductCarousel'">
  <cx-carousel
    *ngIf="items$ | async as items"
    [title]="title$ | async"
    [items]="items"
    [template]="carouselItem"
    [trackByFn]="trackByFn"
  >
  </cx-carousel>
</ng-container>

<ng-template #carouselItem let-item="item">
  <a tabindex="0" [routerLink]="{ cxRoute: 'product', params: item } | cxUrl">
    <cx-media [container]="item.images?.PRIMARY" format="product"></cx-media>
    <h4>{{ item.name }}</h4>
    <div class="price">{{ item.price?.formattedValue }}</div>
  </a>
</ng-template>
