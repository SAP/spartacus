<ng-container *cxFeature="'productCarouselScrolling'">
  @if (items$ | async; as items) {
    <cx-carousel-scrolling
      role="region"
      [attr.aria-label]="
        'productCarousel.carouselLabel' | cxTranslate: { title: title$ | async }
      "
      [items]="items"
      [title]="title$ | async"
      [template]="carouselItem"
      [trackByFn]="trackByFn"
    >
    </cx-carousel-scrolling>
  }
</ng-container>
<ng-container *cxFeature="'!productCarouselScrolling'">
  @if (items$ | async; as items) {
    <cx-carousel
      role="region"
      [attr.aria-label]="
        'productCarousel.carouselLabel' | cxTranslate: { title: title$ | async }
      "
      [items]="items"
      [title]="title$ | async"
      [template]="carouselItem"
      itemWidth="285px"
      [trackByFn]="trackByFn"
    >
    </cx-carousel>
  }
</ng-container>

<ng-template #carouselItem let-item="item" let-itemIndex="itemIndex">
  <cx-product-carousel-item
    [item]="item"
    [itemIndex]="itemIndex"
  ></cx-product-carousel-item>
</ng-template>
