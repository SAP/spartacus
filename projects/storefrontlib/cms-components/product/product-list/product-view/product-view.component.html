<button
  class="btn cx-product-layout"
  [ngClass]="buttonClass"
  (click)="changeMode()"
  tabindex="0"
  attr.aria-label="{{
    viewMode === iconTypes.GRID
      ? ('productView.gridView' | cxTranslate)
      : viewMode === iconTypes.LIST
        ? ('productView.listView' | cxTranslate)
        : null
  }}"
  attr.title="{{
    viewMode === iconTypes.GRID
      ? ('productView.gridView' | cxTranslate)
      : viewMode === iconTypes.LIST
        ? ('productView.listView' | cxTranslate)
        : null
  }}"
>
  @if (viewMode === iconTypes.GRID) {
    <cx-icon [type]="iconTypes.GRID"></cx-icon>
  }
  @if (viewMode === iconTypes.LIST) {
    <cx-icon [type]="iconTypes.LIST"></cx-icon>
  }
</button>
