@if (mainImage$ | async; as main) {
  <cx-media
    [container]="main"
    *cxLcpContext="let lcpContext"
    [fetchPriority]="lcpContext.fetchPriority$ | async"
  ></cx-media>
}

@if (thumbs$ | async; as thumbs) {
  <ng-container *cxFeature="'productCarouselScrolling'">
    @if (thumbs.length) {
      <cx-carousel-scrolling
        class="thumbs"
        [items]="thumbs"
        [template]="thumb"
        [trackByFn]="trackByFn"
      ></cx-carousel-scrolling>
    }
  </ng-container>

  <ng-container *cxFeature="'!productCarouselScrolling'">
    @if (thumbs.length) {
      <cx-carousel
        class="thumbs"
        [items]="thumbs"
        itemWidth="120px"
        [hideIndicators]="false"
        [template]="thumb"
      ></cx-carousel>
    }
  </ng-container>
}

<ng-template #thumb let-item="item">
  <cx-media
    [container]="item.container"
    tabindex="0"
    (focus)="openImage(item.container)"
    [class.is-active]="isActive(item.container) | async"
    format="product"
  >
  </cx-media>
</ng-template>
