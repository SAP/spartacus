<label *ngIf="(orgUnits$ | async)?.length ?? 0 > 1">
  <span>{{ 'b2bUnitSelection.selector.label' | cxTranslate }}:</span>
  <div class="cx-select-wrapper">
    <select (change)="onChange($any($event).target.value)">
      <option
        *ngFor="let unit of orgUnits$ | async"
        [value]="unit.name"
        [selected]="(activeUnitName$ | async) === unit.name"
      >{{ unit.name }}</option>
    </select>
    <cx-icon aria-hidden="true" [type]="iconTypes.CARET_DOWN" class="small" />
  </div>
</label>
