<div
  class="inner"
  [cxFocus]="
    isA11yCardNotificationMessageFeatureEnabled
      ? {}
      : { autofocus: true, focusOnEscape: true }
  "
  (esc)="close()"
>
  @if (messageIcon) {
    <cx-icon [type]="messageIcon" />
  }
  <p>{{ message | cxTranslate }}</p>
  <button
    class="close"
    (click)="close()"
    type="button"
    attr.aria-label="{{ 'common.close' | cxTranslate }}"
    attr.title="{{ 'common.close' | cxTranslate }}"
  >
    <cx-icon [type]="closeIcon" />
  </button>
</div>
