<cx-split-view [hideMode]="false">
  <ng-container *ngIf="structure$ | async as structure">
    <cx-view
      class="list"
      *ngIf="listData$ | async as data"
      role="region"
      [attr.aria-labelledby]="viewType + '_title'"
    >
      <div class="header">
        <div aria-live="polite" class="title">
          <h2>
            <span id="{{ viewType + '_title' }}">
              {{
                viewType + '.header'
                  | cxTranslate: { count: getListCount(data) }
              }}
            </span>
            <button
              [cxPopover]="listHint"
              [cxPopoverOptions]="{
                placement: 'auto',
                class: 'hint-popover',
                appendToBody: true,
                displayCloseButton: true,
              }"
              [attr.aria-label]="
                'organization.information'
                  | cxTranslate
                    : { title: viewType + '.groupName' | cxTranslate }
              "
              [attr.title]="
                'organization.information'
                  | cxTranslate
                    : { title: viewType + '.groupName' | cxTranslate }
              "
            >
              <cx-icon [type]="iconTypes.INFO"> </cx-icon>
            </button>
          </h2>
        </div>

        <div class="actions">
          <!-- Search box -->
          <div class="search-wrapper" *ngIf="isSearchEnabled">
            <label class="search-label">
              <span class="label-text">{{
                'organization.search.label' | cxTranslate
              }}</span>
              <div class="input-wrapper">
                <input
                  type="text"
                  class="form-control search-input"
                  [placeholder]="
                    searchPlaceholderKey | cxTranslate
                  "
                  [(ngModel)]="searchQuery"
                  (ngModelChange)="
                    onSearchQueryChange($any(data.pagination), $event)
                  "
                  [attr.aria-label]="'organization.search.label' | cxTranslate"
                />
                <button
                  *ngIf="!searchQuery"
                  type="button"
                  class="search-btn"
                  [attr.aria-label]="'organization.search.label' | cxTranslate"
                >
                  <cx-icon [type]="iconTypes.SEARCH"></cx-icon>
                </button>
                <button
                  *ngIf="searchQuery"
                  type="button"
                  class="search-clear"
                  (click)="clearSearch($any(data.pagination))"
                  [attr.aria-label]="'organization.search.clear' | cxTranslate"
                >
                  <cx-icon [type]="iconTypes.CLOSE"></cx-icon>
                </button>
              </div>
            </label>
          </div>
          <label class="sort-wrapper" *ngIf="data.pagination?.sort">
            <span class="label-text">{{
              structure.type + '.sortBy' | cxTranslate
            }}</span>
            <ng-select
              name="sort"
              class="sort"
              [searchable]="false"
              [clearable]="false"
              (change)="sort($any(data.pagination))"
              [tabIndex]="0"
              [(ngModel)]="sortCode"
              [attr.aria-label]="
                (sortCode
                  ? structure.type + '.sort.' + sortCode
                  : structure.type + '.sortBy'
                ) | cxTranslate
              "
              ariaLabelDropdown="{{
                'common.ngSelectDropdownOptionsList' | cxTranslate
              }}"
            >
              <ng-option *ngFor="let sort of data.sorts" [value]="sort.code">
                {{ structure.type + '.sort.' + sort.code | cxTranslate }}
              </ng-option>
            </ng-select>
          </label>

          <ng-content select="[actions]"></ng-content>

          <ng-container
            *ngIf="
              createButtonType === createButtonAllTypes.LINK;
              else showButton
            "
          >
            <a
              *ngIf="!hideAddButton"
              class="button btn btn-sm primary btn-primary create"
              [routerLink]="{ cxRoute: structure.type + 'Create' } | cxUrl"
              routerLinkActive="disabled"
            >
              {{ getCreateButtonLabel() | cxTranslate }}
            </a>
          </ng-container>
        </div>
      </div>

      <cx-table
        *ngIf="
          data.values && (data.values.length > 0 || searchQuery);
          else emptyList
        "
        [structure]="structure"
        [data]="data.values"
        [i18nRoot]="domainType"
        [currentItem]="{ property: key, value: currentKey$ | async }"
        (launch)="launchItem($event)"
        role="tree"
      >
      </cx-table>

      <p
        *ngIf="searchQuery && data.values && data.values.length === 0"
        class="instruction is-empty no-search-results"
      >
        {{ viewType + '.search.noResults' | cxTranslate }}
      </p>

      <div class="footer">
        <cx-pagination
          [pagination]="data.pagination"
          (viewPageEvent)="browse($any(data.pagination), $event)"
        ></cx-pagination>
      </div>
    </cx-view>

    <!-- nested split views are rendered inside child routes -->
    <router-outlet></router-outlet>
  </ng-container>
</cx-split-view>

<ng-template #emptyList>
  <p class="instruction is-empty">
    {{ 'organization.messages.emptyList' | cxTranslate }}
  </p>
</ng-template>

<ng-template #listHint>
  <p>
    {{ viewType + '.hint' | cxTranslate }}
  </p>
</ng-template>

<ng-template #showButton>
  <button
    *ngIf="!hideAddButton"
    class="button btn btn-sm primary btn-primary create"
    (click)="onCreateButtonClick()"
  >
    {{ getCreateButtonLabel() | cxTranslate }}
  </button>
</ng-template>
