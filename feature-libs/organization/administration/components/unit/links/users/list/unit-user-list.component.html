<cx-org-sub-list key="customerId" [routerKey]="routerKey" [showHint]="true">
  @if (isUpdatingUserAllowed) {
    <a
      actions
      class="link btn btn-link btn-sm"
      routerLink="create"
      [class.disabled]="!(unit$ | async)?.active"
    >
      {{ 'organization.create' | cxTranslate }}
    </a>
  }
  <cx-org-disable-info
    info
    i18nRoot="orgUnitUsers"
    [displayInfoConfig]="{
      disabledCreate: true,
      disabledEnable: false,
      disabledEdit: false,
    }"
  >
  </cx-org-disable-info>
</cx-org-sub-list>
