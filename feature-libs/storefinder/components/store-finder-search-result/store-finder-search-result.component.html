@if (!(isLoading$ | async) && (locations$ | async); as locations) {
  <div>
    @if (locations?.stores.length) {
      <div>
        <div class="cx-pagination">
          <cx-pagination
            aria-hidden="true"
            [pagination]="locations.pagination"
            (viewPageEvent)="viewPage($event)"
          ></cx-pagination>
        </div>
      </div>
    }
    @if (locations?.stores.length) {
      <cx-store-finder-list
        [locations]="locations"
        [useMylocation]="useMyLocation"
      ></cx-store-finder-list>
    }
    @if (!locations?.stores.length) {
      <div class="container">
        <div class="row">
          <span class="cx-no-stores" role="alert">
            {{ 'storeFinder.noStoresMessage' | cxTranslate }}
          </span>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="cx-spinner">
    <cx-spinner></cx-spinner>
  </div>
}
