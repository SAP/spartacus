@if (pageState$ | async; as pageState) {
  @if(!pageState.isLoading){
  <div class="container">
    <div class="cx-counter">
      <h3 class="cx-counter-title">
        {{ 'storeFinder.storesFoundTitle' | cxTranslate }}
      </h3>
      <span role="alert">
        {{
        'storeFinder.storesFound'
        | cxTranslate: { count: pageState.locations.stores?.length }
        }}
      </span>
    </div>
    <div class="row">
      @for (location of pageState?.locations.stores; track location) {
        <div
          class="col-sm-6 col-md-4 col-lg-3 item"
          >
          <cx-store-finder-list-item [location]="location" />
        </div>
      }
    </div>
  </div>
  }
}
@else {
  <div class="cx-spinner"><cx-spinner /></div>
}
