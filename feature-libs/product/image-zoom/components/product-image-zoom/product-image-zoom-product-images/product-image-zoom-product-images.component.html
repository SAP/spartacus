@if (mainImage$ | async; as main) {
  <cx-media
    [container]="main"
    (click)="triggerZoom(true)"
    *cxLcpContext="let lcpContext"
    [fetchPriority]="lcpContext.fetchPriority$ | async"
  ></cx-media>
  <cx-product-image-zoom-trigger
    [expandImage]="expandImage.value"
    [galleryIndex]="selectedIndex"
    (dialogClose)="triggerZoom(false)"
  ></cx-product-image-zoom-trigger>
}

@if (thumbs$ | async; as thumbs) {
  @if (product$ | async; as product) {
    <ng-container *cxFeature="'productCarouselScrolling'">
      @if (thumbs.length) {
        <cx-carousel-scrolling
          role="region"
          [attr.aria-label]="
            'carousel.carouselForProduct'
              | cxTranslate: { product: product.name }
          "
          tabindex="-1"
          class="thumbs"
          [items]="thumbs"
          [template]="thumb"
          [trackByFn]="trackByFn"
        ></cx-carousel-scrolling>
      }
    </ng-container>
    <ng-container *cxFeature="'!productCarouselScrolling'">
      @if (thumbs.length) {
        <cx-carousel
          role="region"
          [attr.aria-label]="
            'carousel.carouselForProduct'
              | cxTranslate: { product: product.name }
          "
          tabindex="-1"
          class="thumbs"
          [items]="thumbs"
          itemWidth="120px"
          [hideIndicators]="false"
          [template]="thumb"
        ></cx-carousel>
      }
    </ng-container>
  }
}

<ng-template #thumb let-item="item">
  <cx-media
    cxFocusableCarouselItem
    [container]="item.container"
    tabindex="0"
    (focus)="openImage(item.container)"
    [class.is-active]="isActive(item.container) | async"
    format="product"
  >
  </cx-media>
</ng-template>
