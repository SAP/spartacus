@if (mainImage$ | async; as main) {
  @if (thumbnails$ | async; as thumbs) {
    <div class="cx-main-image-group">
      <div class="cx-navigate-image">
        @if (getPreviousProduct(thumbs) | async; as previousProduct) {
          <button
            class="btn btn-link"
            [attr.aria-label]="
              'productImageZoomDialog.previousSlide' | cxTranslate
            "
            [attr.title]="'productImageZoomDialog.previousSlide' | cxTranslate"
            (click)="openImage(previousProduct.container)"
          >
            <cx-icon [type]="iconType.CARET_LEFT" />
          </button>
        }
      </div>
      <!-- TODO: (CXSPA-7492) - Remove feature flag next major release. -->
      <div *cxFeature="'a11yKeyboardAccessibleZoom'" class="cx-image-container">
        @if (!isZoomed) {
          <cx-media
            #defaultImage
            class="cx-default-image-zoom"
            (loaded)="onImageLoad()"
            [container]="main"
          />
        }
        @if (isZoomed) {
          <div #zoomContainer class="cx-zoom-container">
            <cx-media
              #zoomedImage
              class="cx-image-zoomed"
              [container]="main"
              (mousemove)="pointerMove($event)"
              (touchmove)="touchMove($event)"
              (touchend)="clearTouch()"
              (loaded)="onImageLoad()"
            />
          </div>
        }
      </div>
      <ng-container *cxFeature="'!a11yKeyboardAccessibleZoom'">
        @if (!isZoomed) {
          <cx-media
            #defaultImage
            class="cx-default-image-zoom"
            [container]="main"
          />
        }
        @if (isZoomed) {
          <div #zoomContainer class="cx-zoom-container">
            <cx-media
              #zoomedImage
              class="cx-image-zoomed"
              [container]="main"
              (mousemove)="pointerMove($event)"
              (touchmove)="touchMove($event)"
              (touchend)="clearTouch()"
            />
          </div>
        }
      </ng-container>
      <div class="cx-navigate-image">
        @if (getNextProduct(thumbs) | async; as nextProduct) {
          <button
            class="btn btn-link"
            [attr.aria-label]="'productImageZoomDialog.nextSlide' | cxTranslate"
            [attr.title]="'productImageZoomDialog.nextSlide' | cxTranslate"
            (click)="openImage(nextProduct.container)"
          >
            <cx-icon [type]="iconType.CARET_RIGHT" />
          </button>
        }
      </div>
    </div>
  }
  <div class="cx-zoom-btn-container" *cxFeature="'a11yKeyboardAccessibleZoom'">
    <button
      #zoomButton
      [disabled]="!(imageLoaded | async)"
      [attr.aria-label]="
        isZoomed
          ? ('common.zoomOut' | cxTranslate)
          : ('common.zoomIn' | cxTranslate)
      "
      title="{{
        isZoomed
          ? ('common.zoomOut' | cxTranslate)
          : ('common.zoomIn' | cxTranslate)
      }}"
      class="btn btn-link cx-zoom-btn"
      (click)="zoom()"
    >
      @if (!isZoomed) {
        <cx-icon [type]="iconType.SEARCH_PLUS" class="cx-zoom-indicator" />
      }
      @if (isZoomed) {
        <cx-icon [type]="iconType.SEARCH_MINUS" class="cx-zoom-indicator" />
      }
    </button>
  </div>
}

<cx-product-image-zoom-thumbnails
  [thumbs$]="thumbnails$"
  [activeThumb]="activeThumb"
  (productImage)="changeImage($event)"
/>
