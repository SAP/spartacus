@if (variants && variants.length) {
  <ul class="variant-list">
    @for (v of variants; track v) {
      <li>
        <img
          [attr.src]="getVariantThumbnailUrl(v.variantOptionQualifiers)"
          [attr.title]="variantNames[v.code]"
          [attr.alt]="variantNames[v.code]"
        />
      </li>
    }
  </ul>
}
