<ng-container *ngIf="overviewContext$ | async as ctx; else ghostSidebar">
  <button
    *ngIf="isSkipLinkEnabled"
    class="cx-visually-hidden cx-configurator-overview-skip-link"
    (click)="skipToOverviewContent()"
  >
    {{ 'configurator.a11y.skipToOverviewContent' | cxTranslate }}
  </button>
  <div
    class="cx-menu-bar"
    [class.cx-menu-bar-menu-only]="!ctx.showFilterTab"
    [attr.role]="ctx.showFilterTab ? 'tablist' : null"
  >
    <ng-container *ngIf="ctx.showFilterTab; else menuLabelOnly">
      <button
        #menuTab
        [tabindex]="getTabIndexForMenuTab()"
        role="tab"
        [attr.aria-selected]="!showFilter"
        [class.active]="!showFilter"
        (keydown)="switchTabOnArrowPress($event, '#menuTab', ctx.showFilterTab)"
        (keydown.enter)="onMenu()"
        (keydown.space)="onMenu()"
        (click)="onMenu()"
      >
        {{ 'configurator.overviewSidebar.menu' | cxTranslate }}
      </button>
      <button
        #filterTab
        [tabindex]="getTabIndexForFilterTab()"
        role="tab"
        [attr.aria-selected]="showFilter"
        [class.active]="showFilter"
        (keydown)="
          switchTabOnArrowPress($event, '#filterTab', ctx.showFilterTab)
        "
        (keydown.enter)="onFilter()"
        (keydown.space)="onFilter()"
        (click)="onFilter()"
      >
        {{ 'configurator.overviewSidebar.filter' | cxTranslate }}
      </button>
    </ng-container>
    <ng-template #menuLabelOnly>
      <div class="cx-menu-bar-item active">
        {{ 'configurator.overviewSidebar.menu' | cxTranslate }}
      </div>
    </ng-template>
  </div>

  <cx-configurator-overview-filter
    *ngIf="ctx.showFilterTab && showFilter"
    [config]="ctx.configuration"
  />

  <cx-configurator-overview-menu
    *ngIf="!showFilter"
    [config]="ctx.configuration"
  />
</ng-container>

<ng-template #ghostSidebar>
  <div class="cx-ghost-menu">
    <div class="cx-ghost-menu-bar ghost"></div>
    <ng-container *ngFor="let number of [0, 1]">
      <ng-container *ngFor="let number of [0, 1, 2]; let i = index">
        <div class="cx-ghost-menu-level1">
          <div class="cx-ghost-menu-item">
            <div class="cx-ghost-menu-item-title ghost"></div>
          </div>

          <ng-container *ngIf="i === 0">
            <div class="cx-ghost-menu-level2">
              <div
                *ngFor="let number of [0, 1, 2, 3]"
                class="cx-ghost-menu-item"
              >
                <div class="cx-ghost-menu-item-title ghost"></div>
              </div>
            </div>
          </ng-container>

          <ng-container *ngIf="i === 1">
            <div class="cx-ghost-menu-level2">
              <div *ngFor="let number of [0, 1, 2]" class="cx-ghost-menu-item">
                <div class="cx-ghost-menu-item-title ghost"></div>
              </div>
              <div class="cx-ghost-menu-level3">
                <div
                  *ngFor="let number of [0, 1, 2]"
                  class="cx-ghost-menu-item"
                >
                  <div class="cx-ghost-menu-item-title ghost"></div>
                </div>
              </div>
            </div>
          </ng-container>

          <ng-container *ngIf="i === 2">
            <div class="cx-ghost-menu-level1">
              <div *ngFor="let number of [0, 1]" class="cx-ghost-menu-item">
                <div class="cx-ghost-menu-item-title ghost"></div>
              </div>
            </div>
          </ng-container>
        </div>
      </ng-container>
    </ng-container>
  </div>
</ng-template>
