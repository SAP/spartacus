<ng-container *ngIf="imagePath$ | async as imagePath; else ghostSidebar">
  <img [src]="imagePath" alt="huhu" class="cx-overview-image" />
</ng-container>

<ng-template #ghostSidebar>
  <img
    *ngIf="imageSketchPath$ | async as imageSketchPath"
    [src]="imageSketchPath"
    alt="huhu"
    class="cx-overview-image"
  />
</ng-template>
