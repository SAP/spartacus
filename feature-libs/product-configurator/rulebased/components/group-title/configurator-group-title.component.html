<ng-container *ngIf="displayedGroup$ | async as group; else ghostGroup">
  <div role="heading" aria-level="2" class="cx-group-title">
    <cx-hamburger-menu
      *ngIf="useCssResponsiveVisibility || (isMobile() | async)"
      [class.cx-mobile-only]="useCssResponsiveVisibility"
    />

    {{ getGroupTitle(group) }}
  </div>
</ng-container>
<ng-template #ghostGroup>
  <div class="cx-ghost-group-title"></div>
</ng-template>
