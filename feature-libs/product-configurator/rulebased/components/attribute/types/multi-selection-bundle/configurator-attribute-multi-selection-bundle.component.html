<div
  id="{{ createAttributeIdForConfigurator(attribute) }}"
  *ngIf="attribute?.values?.length"
  class="cx-multi-selection-bundle-dropdown"
>
  <div
    *ngIf="withQuantityOnAttributeLevel"
    class="cx-attribute-level-quantity-price"
  >
    <cx-configurator-attribute-quantity
      (changeQuantity)="onChangeAttributeQuantity($event)"
      [quantityOptions]="extractQuantityParameters(attribute.quantity)"
    ></cx-configurator-attribute-quantity>

    <cx-configurator-price
      [formula]="extractPriceFormulaParameters()"
    ></cx-configurator-price>
  </div>

  <!-- Trigger with a search box to filter options -->
  <div
    class="cx-trigger"
    [attr.aria-expanded]="isDropdownOpen"
    (click)="openDropdown($event)"
  >
    <input
      #searchInput
      type="text"
      class="cx-search-input"
      [placeholder]="isDropdownOpen ? 'Search' : 'Select products'"
      [readonly]="!isDropdownOpen"
      [(ngModel)]="searchTerm"
      (focus)="openDropdown($event)"
      (click)="$event.stopPropagation()"
    />
    <button
      type="button"
      class="cx-caret-button"
      [attr.aria-expanded]="isDropdownOpen"
      (click)="toggleDropdown($event)"
    >
      <cx-icon
        class="cx-caret"
        [type]="isDropdownOpen ? iconTypes.CARET_UP : iconTypes.CARET_DOWN"
        aria-hidden="true"
      ></cx-icon>
    </button>
  </div>

  <!-- Dropdown panel showing all options via optionsTemplate -->
  <div
    class="cx-list"
    *ngIf="isDropdownOpen"
    (click)="$event.stopPropagation()"
  >
    <ng-container *ngFor="let value of filteredValues">
      <ng-container
        *ngTemplateOutlet="
          optionsTemplate;
          context: { $implicit: value, index: getValueIndex(value) }
        "
      ></ng-container>
    </ng-container>

    <div *ngIf="filteredValues.length === 0" class="cx-no-results">
      No results found
    </div>
  </div>
</div>

<!-- Options template: render a product card for each value -->
<ng-template #optionsTemplate let-value let-i="index">
  <cx-configurator-attribute-product-card
    *cxFeature="'productConfiguratorConsolidatedButtonDisabling'"
    id="{{ createAttributeValueIdForConfigurator(attribute, value.valueCode) }}"
    (handleDeselect)="onDeselect($event)"
    (handleQuantity)="onChangeValueQuantity($event)"
    (handleSelect)="onSelect($event)"
    [productCardOptions]="
      extractProductCardParameters(preventAction$ | async, value, i)
    "
  >
  </cx-configurator-attribute-product-card>
  <cx-configurator-attribute-product-card
    *cxFeature="'!productConfiguratorConsolidatedButtonDisabling'"
    id="{{ createAttributeValueIdForConfigurator(attribute, value.valueCode) }}"
    (handleDeselect)="onDeselect($event)"
    (handleQuantity)="onChangeValueQuantity($event)"
    (handleSelect)="onSelect($event)"
    [productCardOptions]="
      extractProductCardParameters(
        preventAction$ | async,
        value,
        i,
        loading$ | async
      )
    "
  >
  </cx-configurator-attribute-product-card>
</ng-template>
