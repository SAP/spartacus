<div id="{{ createAttributeIdForConfigurator(attribute) }}">
  <section
    class="cx-accordion"
    id="{{ createAttributeUiKey('selected-products', attribute.name) }}"
  >
    <div class="cx-header">
      <span class="cx-title" role="heading" aria-level="2">
        {{
          'configurator.attribute.selectedProducts'
            | cxTranslate: { count: selectedProducts.length }
        }}
      </span>
      <button
        *ngIf="selectedProducts.length > 0"
        type="button"
        (click)="toggleSelectedProducts()"
        [attr.aria-expanded]="selectedProductsExpanded"
        [attr.aria-controls]="
          createAttributeUiKey('selected-products', attribute.name)
        "
        [attr.aria-label]="
          (selectedProductsExpanded
            ? 'configurator.a11y.collapseSelectedProducts'
            : 'configurator.a11y.expandSelectedProducts'
          ) | cxTranslate
        "
      >
        <cx-icon [type]="selectedProductsToggleIcon" aria-hidden="true" />
      </button>
    </div>
    <ng-container *ngIf="selectedProductsExpanded && selectedProducts.length">
      <cx-configurator-attribute-product-card
        *ngFor="let row of selectedProducts; let i = index"
        id="{{ createAttributeValueIdForConfigurator(attribute, row.id) }}"
        (handleDeselect)="onRemove(row)"
        (handleRowAction)="onRowAction(row, $event)"
        [productCardOptions]="
          extractProductCardParameters(row, i, selectedProducts.length)
        "
      />
    </ng-container>
  </section>
  <section
    class="cx-accordion"
    id="{{ createAttributeUiKey('available-products', attribute.name) }}"
  >
    <div class="cx-header">
      <span class="cx-title" role="heading" aria-level="2">
        {{
          'configurator.attribute.availableProducts'
            | cxTranslate: { count: availableProducts.length }
        }}
      </span>
      <button
        *ngIf="availableProducts.length > 0"
        type="button"
        (click)="toggleAvailableProducts()"
        [attr.aria-expanded]="availableProductsExpanded"
        [attr.aria-controls]="
          createAttributeUiKey('available-products', attribute.name)
        "
        [attr.aria-label]="
          (availableProductsExpanded
            ? 'configurator.a11y.collapseAvailableProducts'
            : 'configurator.a11y.expandAvailableProducts'
          ) | cxTranslate
        "
      >
        <cx-icon [type]="availableProductsToggleIcon" aria-hidden="true" />
      </button>
    </div>
    <ng-container *ngIf="availableProductsExpanded && availableProducts.length">
      <ng-container
        *ngIf="showAvailableProductsAsDropdown; else availableProductsList"
      >
        <div class="cx-drop-down">
          <div
            class="cx-trigger"
            [attr.aria-expanded]="isAvailableProductsDropdownOpen"
            (click)="openAvailableProductsDropdown($event)"
          >
            <input
              #availableProductsSearchInput
              type="text"
              class="cx-search-input"
              autocomplete="off"
              [placeholder]="
                (isAvailableProductsDropdownOpen
                  ? 'configurator.attribute.searchAvailableProducts'
                  : 'configurator.attribute.selectAvailableProducts'
                ) | cxTranslate
              "
              [attr.aria-label]="
                'configurator.a11y.listbox'
                  | cxTranslate: { count: availableProducts.length }
              "
              [readonly]="!isAvailableProductsDropdownOpen"
              [value]="availableProductsSearchTerm"
              (input)="
                availableProductsSearchTerm = availableProductsSearchInput.value
              "
              (focus)="openAvailableProductsDropdown($event)"
              (click)="$event.stopPropagation()"
            />
            <button
              type="button"
              [attr.aria-expanded]="isAvailableProductsDropdownOpen"
              [attr.aria-label]="
                'configurator.a11y.toggleAvailableProductsDropdown'
                  | cxTranslate
              "
              (click)="toggleAvailableProductsDropdown($event)"
            >
              <cx-icon
                [type]="availableProductsDropdownIcon"
                aria-hidden="true"
              />
            </button>
          </div>
          <div
            class="cx-list"
            *ngIf="isAvailableProductsDropdownOpen"
            (click)="$event.stopPropagation()"
          >
            <ng-container *ngFor="let row of filteredAvailableProducts">
              <ng-container
                *ngTemplateOutlet="
                  availableProductCard;
                  context: {
                    $implicit: row,
                    index: getAvailableProductIndex(row),
                  }
                "
              />
            </ng-container>

            <div
              *ngIf="filteredAvailableProducts.length === 0"
              class="cx-no-results"
            >
              {{
                'configurator.attribute.noAvailableProductsFound' | cxTranslate
              }}
            </div>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </section>
</div>

<ng-template #availableProductsList>
  <ng-container *ngFor="let row of availableProducts; let i = index">
    <ng-container
      *ngTemplateOutlet="
        availableProductCard;
        context: { $implicit: row, index: i }
      "
    />
  </ng-container>
</ng-template>

<ng-template #availableProductCard let-row let-i="index">
  <cx-configurator-attribute-product-card
    id="{{ createAttributeValueIdForConfigurator(attribute, row.id) }}"
    (handleSelect)="onAdd(row)"
    (handleRowAction)="onRowAction(row, $event)"
    [productCardOptions]="
      extractProductCardParameters(row, i, availableProducts.length)
    "
  />
</ng-template>
