@if (config) {
  @if (isInPageNavigationEnabled) {
    <nav
      tabindex="-1"
      [attr.aria-label]="'configurator.a11y.overviewMenu' | cxTranslate"
    >
      <ng-container *ngTemplateOutlet="rootGroups" />
    </nav>
  } @else {
    <ng-container *ngTemplateOutlet="rootGroups" />
  }
}

<ng-template #rootGroups>
  <ng-container
    *ngTemplateOutlet="
      groups;
      context: {
        overviewGroups: config.overview.groups,
        level: 1,
        idPrefix: '',
      }
    "
  />
</ng-template>

<ng-template
  #groups
  let-overviewGroups="overviewGroups"
  let-level="level"
  let-idPrefix="idPrefix"
>
  <ul>
    @for (group of overviewGroups; track group) {
      <li [ngClass]="getGroupLevelStyleClasses(level)">
        <button
          id="{{ getMenuItemId(idPrefix, group.id) }}"
          class="cx-menu-item"
          [attr.aria-label]="
            (isInPageNavigationEnabled
              ? 'configurator.a11y.navigateToOverviewGroup'
              : 'configurator.a11y.groupName'
            ) | cxTranslate: { group: group.groupDescription }
          "
          (click)="navigateToGroup(idPrefix, group.id)"
        >
          <span aria-hidden="true"> {{ group.groupDescription }}</span>
          <cx-icon [type]="iconTypes.ARROW_LEFT" aria-hidden="true" />
        </button>
        @if (group.subGroups?.length > 0) {
          <ng-container
            *ngTemplateOutlet="
              groups;
              context: {
                overviewGroups: group.subGroups,
                level: level + 1,
                idPrefix: getPrefixId(idPrefix, group.id),
              }
            "
          />
        }
      </li>
    }
  </ul>
</ng-template>
