@if (text) {
  <span [innerHTML]="textToShow"></span>

  @if (showMore) {
    <button (click)="toggleShowMore()" tabindex="{{ tabIndex }}">
      @if (showHiddenText) {
        &nbsp;... {{ 'configurator.button.less' | cxTranslate }}
      } @else {
        &nbsp;... {{ 'configurator.button.more' | cxTranslate }}
      }
    </button>
  }
}
