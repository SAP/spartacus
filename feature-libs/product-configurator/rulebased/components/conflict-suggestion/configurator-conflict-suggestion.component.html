<div class="alert alert-info" *ngIf="displayConflictSuggestion(currentGroup)">
  <span class="alert-icon">
    <cx-icon [type]="iconTypes.INFO" aria-hidden="true" />
  </span>
  <div class="cx-suggestion-content">
    <div
      class="cx-title"
      [attr.aria-label]="
        ('configurator.conflict.suggestionTitle'
          | cxTranslate: { number: suggestionNumber + 1 }) +
        ' ' +
        ('configurator.conflict.suggestionText'
          | cxTranslate: { attribute: attribute.label })
      "
    >
      <span aria-hidden="true">{{
        'configurator.conflict.suggestionTitle'
          | cxTranslate: { number: suggestionNumber + 1 }
      }}</span>
    </div>
    <span aria-hidden="true">{{
      'configurator.conflict.suggestionText'
        | cxTranslate: { attribute: attribute.label }
    }}</span>
  </div>
</div>
