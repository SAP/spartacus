<div id="{{ createGroupId(group.id) }}" role="tabpanel">
  @if (displayConflictDescription(group)) {
    <cx-configurator-conflict-description
      [currentGroup]="group"
    ></cx-configurator-conflict-description>
  }
  @for (
    attribute of group.attributes;
    track trackByFn(indexOfAttribute, attribute);
    let indexOfAttribute = $index
  ) {
    <div
      class="cx-group-attribute"
      id="{{ createAttributeUiKey('group-attribute', attribute.name) }}"
      [class.cx-hidden]="!attribute.visible"
    >
      @if (isConflictGroupType(group.groupType)) {
        <cx-configurator-conflict-suggestion
          [currentGroup]="group"
          [attribute]="attribute"
          [suggestionNumber]="indexOfAttribute"
        ></cx-configurator-conflict-suggestion>
      }

      @if (activeLanguage$ | async; as activeLanguage) {
        <div
          [cxConfiguratorAttributeComponent]="{
            componentKey: 'Header',
            attribute: attribute,
            owner: owner,
            group: group,
            language: activeLanguage,
            expMode: (expMode | async) ?? false,
            isNavigationToGroupEnabled: isNavigationToGroupEnabled,
            isPricingAsync: isPricingAsync,
          }"
        ></div>

        <div
          [cxConfiguratorAttributeComponent]="{
            componentKey: getComponentKey(attribute),
            attribute: attribute,
            owner: owner,
            group: group,
            language: activeLanguage,
            expMode: (expMode | async) ?? false,
            isPricingAsync: isPricingAsync,
          }"
        ></div>

        <div
          [cxConfiguratorAttributeComponent]="{
            componentKey: 'Footer',
            attribute: attribute,
            owner: owner,
            group: group,
            language: activeLanguage,
            expMode: (expMode | async) ?? false,
            isPricingAsync: isPricingAsync,
          }"
        ></div>
      }
    </div>
  }
</div>
