<ng-container *ngIf="messages$ | async as messages">
  <ng-container *ngIf="messages.infoMessages.length > 0">
    <div
      aria-live="assertive"
      aria-atomic="true"
      class="alert-message alert-message-invalid-warning"
    >
      <span class="alert-icon">
        <cx-icon type="WARNING"></cx-icon>
      </span>
      <span class="cx-warning-text" *ngIf="messages.infoMessages.length > 1">
        {{ 'configurator.header.multipleWarnings' | cxTranslate }}</span
      >
      <button
        (click)="toggleWarnings()"
        *ngIf="messages.infoMessages.length > 1"
        class="cx-warning-toggle"
        [attr.aria-expanded]="showWarnings"
      >
        {{ 'configurator.header.reviewWarnings' | cxTranslate }}

        <ng-container *ngIf="!showWarnings">
          <cx-icon type="CARET_DOWN"></cx-icon>
        </ng-container>

        <ng-container *ngIf="showWarnings">
          <cx-icon type="CARET_UP"></cx-icon>
        </ng-container>
      </button>
      <div
        class="cx-warning-messages"
        [class.inline]="messages.infoMessages.length === 1"
      >
        <div
          class="cx-warning-message"
          [class.open]="showWarnings || messages.infoMessages.length === 1"
          *ngFor="let warningMessage of messages.infoMessages"
        >
          {{ warningMessage }}
        </div>
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="messages.warningMessages.length > 0">
    <div
      aria-live="assertive"
      aria-atomic="true"
      role="alert"
      class="alert-message alert-message-error"
    >
      <span class="alert-icon">
        <cx-icon type="ERROR"></cx-icon>
      </span>
      <span class="cx-error-text" *ngIf="messages.warningMessages.length > 1">
        {{ 'configurator.header.multipleErrors' | cxTranslate }}</span
      >
      <button
        (click)="toggleErrors()"
        *ngIf="messages.warningMessages.length > 1"
        class="cx-error-toggle"
        [attr.aria-expanded]="showErrors"
      >
        {{ 'configurator.header.reviewErrors' | cxTranslate }}
        <ng-container *ngIf="!showErrors">
          <cx-icon type="CARET_DOWN"></cx-icon>
        </ng-container>

        <ng-container *ngIf="showErrors">
          <cx-icon type="CARET_UP"></cx-icon>
        </ng-container>
      </button>
      <div
        class="cx-error-messages"
        [class.inline]="messages.warningMessages.length === 1"
      >
        <div
          class="cx-error-message"
          [class.open]="showErrors || messages.warningMessages.length === 1"
          *ngFor="let errorMessage of messages.warningMessages"
        >
          {{ errorMessage }}
        </div>
      </div>
    </div>
  </ng-container>
</ng-container>
