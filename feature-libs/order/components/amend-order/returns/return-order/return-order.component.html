@if (form$ | async; as form) {
  <ng-container *ngTemplateOutlet="actions"></ng-container>

  @if (entries$ | async; as entries) {
    <cx-amend-order-items [entries]="entries"> </cx-amend-order-items>
  }

  <cx-form-errors [control]="form.get('entries')"></cx-form-errors>

  <ng-container *ngTemplateOutlet="actions"></ng-container>

  <ng-template #actions>
    @if (orderCode) {
      <cx-amend-order-actions
        [orderCode]="orderCode"
        [amendOrderForm]="form"
        backRoute="orderDetails"
        forwardRoute="orderReturnConfirmation"
      ></cx-amend-order-actions>
    }
  </ng-template>
}
