@if (form$ | async; as form) {
  @if (!form.get('entries').valid && form.get('entries').touched) {
    <cx-message
      role="alert"
      [text]="'formErrors.cxNoSelectedItemToCancel' | cxTranslate"
      [isVisibleCloseButton]="false"
      [type]="globalMessageType.MSG_TYPE_ERROR"
      />
  }
  <ng-container *ngTemplateOutlet="actions" />
  @if (entries$ | async; as entries) {
    <cx-amend-order-items
      [entries]="entries"
      />
  }
  <ng-container *ngTemplateOutlet="actions" />
  <ng-template #actions>
    @if (orderCode) {
      <cx-amend-order-actions
        [orderCode]="orderCode"
        [amendOrderForm]="form"
        backRoute="orderDetails"
        forwardRoute="orderCancelConfirmation"
        />
    }
  </ng-template>
}
