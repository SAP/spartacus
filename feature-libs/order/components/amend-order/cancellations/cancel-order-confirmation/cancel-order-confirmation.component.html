@if (form$ | async; as form) {
  <form
    [formGroup]="form"
    (ngSubmit)="submit(form)"
    >
    <ng-container *ngTemplateOutlet="actions" />
    @if (entries$ | async; as entries) {
      <cx-amend-order-items
        [entries]="entries"
        [isConfirmation]="true"
        />
    }
    <ng-container *ngTemplateOutlet="actions" />
    <ng-template #actions>
      @if (orderCode) {
        <cx-amend-order-actions
          [orderCode]="orderCode"
          [amendOrderForm]="form"
          backRoute="orderCancel"
          />
      }
    </ng-template>
  </form>
}
