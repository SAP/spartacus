<div *ngFor="let consignment of consignments" class="cx-list row">
  <ng-template
    [cxOutlet]="OrderOutlets.ORDER_CONSIGNMENT"
    [cxOutletContext]="{ item: consignment, order: order }"
  >
    <div class="cx-list-header col-12">
      <div class="cx-list-status">
        <span *ngIf="consignment">
          {{ getStatusText(consignment?.status) | async | titlecase }}
        </span>
      </div>
      <div *ngIf="consignment?.statusDate" class="cx-list-date">
        <div>{{ consignment?.statusDate | cxDate }}</div>
      </div>

      <cx-consignment-tracking
        [orderCode]="order.code"
        [consignment]="consignment"
        *cxFeature="'consignmentTracking'"
      >
      </cx-consignment-tracking>
    </div>
  </ng-template>

  <div class="cx-list-item col-12">
    <ng-container *cxFeature="'enableBundles'">
      <div [ngClass]="consignment?.entries?.length === 0 ? 'emptyList' : 'noneEmptyList'">
        <ng-template
          [cxAbstractOrderContext]="{
            id: order.code,
            type: abstractOrderType.ORDER,
          }"
          [cxOutlet]="CartOutlets.CART_ITEM_LIST"
          [cxOutletContext]="{
            items: consignment.entries,
            readonly: true,
            promotionLocation: promotionLocation,
          }"
        >
        </ng-template>
      </div>
      <ng-container *ngFor="let bundle of consignment.hierarchyTrees">
        <cx-hierarchy
          [options]="{
          tree: bundle,
          template: bundlesTemplate,
          titleReadonly: true,
          collasibleReadonly: true,
        }"
          >
        </cx-hierarchy>
      </ng-container>
    </ng-container>

    <ng-container *cxFeature="'!enableBundles'">
      <div class="cx-list-item col-12">
        <ng-template
          [cxAbstractOrderContext]="{
            id: order.code,
            type: abstractOrderType.ORDER,
          }"
          [cxOutlet]="CartOutlets.CART_ITEM_LIST"
          [cxOutletContext]="{
            items: consignment.entries,
            readonly: true,
            promotionLocation: promotionLocation,
            options: {
              displayAddToCart: enableAddToCart,
              addToCartString: buyItAgainTranslation,
              optionalBtn: addToCartBtn,
            },
          }"
        >
        </ng-template>
      </div>
    </ng-container>
  </div>
</div>

<ng-template let-ctx #addToCartBtn>
  <cx-add-to-cart
    [productCode]="ctx.item.product?.code"
    [product]="ctx.item.product"
    [showQuantity]="false"
    [options]="ctx.options"
    [pickupStore]="ctx.item.deliveryPointOfService?.name"
    class="add-to-cart"
  >
  </cx-add-to-cart>
</ng-template>

<ng-template #bundlesTemplate let-items>
  <ng-template
    [cxOutlet]="CartOutlets.CART_ITEM_LIST"
    [cxOutletContext]="{
      items: items,
      readonly: true,
      hasHeader: false,
      promotionLocation: promotionLocation,
    }"
  >
  </ng-template>
</ng-template>
