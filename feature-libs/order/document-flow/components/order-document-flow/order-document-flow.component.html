<div class="row justify-content-end" *ngIf="(order$ | async)?.code as code">
  <div class="col-sm-12 col-md-6 col-lg-5 col-xl-4">
    <button
      #element
      class="btn btn-secondary w-100 order-document-flow-dialog-btn"
      (click)="onOrderDocumentFlowClick(code)"
    >
      {{ 'documentFlow.button' | cxTranslate }}
    </button>
  </div>
</div>
