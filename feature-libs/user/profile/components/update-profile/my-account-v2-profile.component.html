@if ((isUpdating$ | async) || !(user$ | async)) {
  <cx-spinner class="overlay"> </cx-spinner>
}
<div>
  <div>
    <div class="flex-line">
      <label class="headertext"
        >{{ 'myAccountV2UserProfile.myInformation' | cxTranslate }}
      </label>
      @if (!isEditing) {
        <button class="editButton" (click)="onEdit()">
          {{ 'common.edit' | cxTranslate }}
        </button>
      }
    </div>
  </div>
  @if (!isEditing) {
    <div>
      <div class="flex-line">
        <label class="text-head">
          {{ 'myAccountV2UserProfile.title' | cxTranslate }}
        </label>
        <label class="value">
          {{ (user$ | async)?.title }}
        </label>
      </div>
      <div class="flex-line">
        <label class="text-head">
          {{ 'myAccountV2UserProfile.name' | cxTranslate }}
        </label>
        <label class="value">
          {{ (user$ | async)?.firstName }} {{ (user$ | async)?.lastName }}
        </label>
      </div>
      <div class="flex-line">
        <label class="text-head">
          {{ 'myAccountV2UserProfile.customerId' | cxTranslate }}
        </label>
        <label class="value">
          {{ (user$ | async)?.customerId }}
        </label>
      </div>
    </div>
  }
  @if (isEditing) {
    <div class="myaccount-editing-area">
      <form (ngSubmit)="onSubmit()" [formGroup]="form">
        <label>
          <span class="label-content, text-head">{{
            'myAccountV2UserProfile.title' | cxTranslate
          }}</span>
          <ng-select
            [clearable]="false"
            [searchable]="false"
            formControlName="titleCode"
            id="title-select"
            ariaLabelDropdown="{{
              'common.ngSelectDropdownOptionsList' | cxTranslate
            }}"
            [cxNgSelectA11y]="{
              ariaLabel: 'myAccountV2UserProfile.title' | cxTranslate,
            }"
          >
            @for (title of titles$ | async; track title) {
              <ng-option [value]="title.code">{{ title.name }}</ng-option>
            }
          </ng-select>
        </label>
        <label>
          <span class="label-content, text-head">{{
            'myAccountV2UserProfile.firstName' | cxTranslate
          }}</span>
          <input
            required="true"
            type="text"
            class="form-control"
            name="firstName"
            formControlName="firstName"
            [attr.aria-invalid]="
              form.get('firstName')?.touched && form.get('firstName')?.invalid
            "
            [attr.aria-errormessage]="'firstNameError'"
          />
          <cx-form-errors
            id="firstNameError"
            [translationParams]="{
              label: 'updateProfileForm.firstName.label' | cxTranslate,
            }"
            [control]="form.get('firstName')"
          ></cx-form-errors>
        </label>

        <label>
          <span class="label-content, text-head">{{
            'myAccountV2UserProfile.lastName' | cxTranslate
          }}</span>
          <input
            required="true"
            type="text"
            class="form-control"
            name="lastName"
            formControlName="lastName"
            [attr.aria-invalid]="
              form.get('lastName')?.touched && form.get('lastName')?.invalid
            "
            [attr.aria-errormessage]="'lastNameError'"
          />
          <cx-form-errors
            id="lastNameError"
            [translationParams]="{
              label: 'updateProfileForm.lastName.label' | cxTranslate,
            }"
            [control]="form.get('lastName')"
          ></cx-form-errors>
        </label>

        <label>
          <span class="label-content, text-head">{{
            'myAccountV2UserProfile.customerId' | cxTranslate
          }}</span>
          <input
            required="true"
            type="text"
            class="form-control"
            name="customerId"
            formControlName="customerId"
            [attr.aria-invalid]="
              form.get('customerId')?.touched && form.get('customerId')?.invalid
            "
            [attr.aria-errormessage]="'customerIdError'"
            readonly
          />
          <cx-form-errors
            id="customerIdError"
            [translationParams]="{
              label: 'updateProfileForm.customerId' | cxTranslate,
            }"
            [control]="form.get('customerId')"
          ></cx-form-errors>
        </label>
      </form>

      <div class="btn-group">
        <button class="btn button-cancel button" (click)="cancelEdit()">
          {{ 'common.cancel' | cxTranslate }}
        </button>
        <button
          class="btn btn-primary button"
          (click)="onSubmit()"
          [disabled]="form.disabled"
        >
          {{ 'common.save' | cxTranslate }}
        </button>
      </div>
    </div>
  }
</div>
