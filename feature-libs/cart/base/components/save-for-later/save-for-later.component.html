@if (isCartEmpty$ | async) {
  @if (data$ | async; as data) {
    <p [innerHTML]="data.content" class="cx-empty-cart-info"></p>
  }
}

@if (saveForLater$ | async; as saveForLater) {
  @if (entries$ | async; as entries) {
    @if (saveForLater.totalItems > 0) {
      <div class="cart-details-wrapper">
        <div class="cx-total">
          {{
            'saveForLaterItems.itemTotal'
              | cxTranslate: { count: saveForLater.totalItems }
          }}
        </div>
        <cx-cart-item-list
          [items]="entries"
          [readonly]="false"
          [cartIsLoading]="!(cartLoaded$ | async)"
          [promotionLocation]="CartLocation.SaveForLater"
          [options]="{
            isSaveForLater: true,
            optionalBtn: moveToCartBtn,
          }"
        ></cx-cart-item-list>
      </div>
    }
  }
}

<ng-template let-ctx #moveToCartBtn>
  <button
    class="btn btn-tertiary cx-sfl-btn"
    [disabled]="ctx.loading"
    (click)="moveToCart(ctx.item)"
    type="button"
  >
    {{ 'saveForLaterItems.moveToCart' | cxTranslate }}
  </button>
</ng-template>
