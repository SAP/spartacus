@if (cart$ | async; as cart) {
  @if (cart.totalItems > 0) {
    <div class="clear-cart-wrapper">
      <button
        #element
        (click)="openDialog($event)"
        class="btn btn-tertiary clear-cart-btn"
        type="button"
      >
        {{ 'clearCart.clearCart' | cxTranslate }}
      </button>
    </div>
  }
}
