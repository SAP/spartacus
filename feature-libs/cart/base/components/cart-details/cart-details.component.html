@if (cart$ | async; as cart) {
  @if (entries$ | async; as entries) {
    @if (cart.totalItems > 0) {
      <div class="cart-details-wrapper">
        <cx-cart-validation-warnings />
        <h2 class="cx-total">
          {{ 'cartDetails.cartName' | cxTranslate: { code: cart.code } }}
        </h2>
        <ng-container *cxFeature="'enableCartSlowNetworkResilience'">
          @if (updating$ | async) {
            <div
              class="cx-cart-details-updating"
              role="status"
              aria-live="polite"
            >
              <cx-spinner aria-hidden="true" />
              <span>{{ 'cartDetails.updating' | cxTranslate }}</span>
            </div>
          }
        </ng-container>
        <cx-promotions
          [promotions]="
            (cart.appliedOrderPromotions || []).concat(
              cart.potentialOrderPromotions || []
            )
          "
        />
        <cx-cart-item-list
          [items]="entries"
          [cartIsLoading]="!(cartLoaded$ | async)"
          [promotionLocation]="promotionLocation"
          [options]="{
            isSaveForLater: false,
            optionalBtn: saveForLaterBtn,
          }"
        />
      </div>
    }
  }
}

<ng-template let-ctx #saveForLaterBtn>
  @if (selectiveCartEnabled) {
    <button
      class="btn btn-tertiary cx-sfl-btn"
      [disabled]="ctx.loading"
      (click)="saveForLater(ctx.item)"
      type="button"
    >
      {{ 'saveForLaterItems.saveForLater' | cxTranslate }}
    </button>
  }
</ng-template>
