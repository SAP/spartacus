@if (quantityInfo$ | async; as qty) {
  @if (qty.min !== undefined || qty.max !== undefined) {
    <div
      class="cx-qty-hint"
      [attr.id]="qty.code ? 'cx-qty-hint-' + qty.code : null"
      >
      @if (qty.min !== undefined) {
        <span>{{
          'validation.minQuantity' | cxTranslate: { min: qty.min }
        }}</span>
      }
      @if (qty.max !== undefined) {
        <span>{{
          'validation.maxQuantity' | cxTranslate: { max: qty.max }
        }}</span>
      }
    </div>
  }
}
