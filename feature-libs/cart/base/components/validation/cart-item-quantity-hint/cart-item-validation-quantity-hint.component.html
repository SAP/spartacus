<ng-container *ngIf="quantityInfo$ | async as qty">
  <div
    class="cx-qty-hint"
    *ngIf="qty.min !== undefined || qty.max !== undefined"
  >
    <span *ngIf="qty.min !== undefined">{{
      'validation.minQuantity' | cxTranslate: { min: qty.min }
    }}</span>
    <span *ngIf="qty.max !== undefined">{{
      'validation.maxQuantity' | cxTranslate: { max: qty.max }
    }}</span>
  </div>
</ng-container>
