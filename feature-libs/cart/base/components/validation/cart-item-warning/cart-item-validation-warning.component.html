<ng-container *ngIf="cartModification$ | async as cartModification">
  <div
    class="alert alert-info"
    *ngIf="isVisible && !isQuantityLimitViolation(cartModification)"
  >
    <span class="alert-icon">
      <cx-icon [type]="iconTypes.INFO" />
    </span>
    <span
      *ngIf="
        displayBackendMessages && cartModification.statusMessage;
        else translatedMessage
      "
    >
      {{ cartModification.statusMessage }}
    </span>
    <ng-template #translatedMessage>
      <span>
        {{
          'validation.' + cartModification.statusCode
            | cxTranslate
              : {
                  quantity: cartModification.quantityAdded,
                }
        }}
      </span>
    </ng-template>

    <button
      class="close"
      type="button"
      title="{{ 'common.close' | cxTranslate }}"
      (click)="isVisible = !isVisible"
    >
      <cx-icon [type]="iconTypes.CLOSE"></cx-icon>
    </button>
  </div>
</ng-container>
