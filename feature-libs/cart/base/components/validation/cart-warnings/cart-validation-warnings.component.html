@for (cartModification of cartModifications$ | async; track cartModification) {
  @if (visibleWarnings[cartModification.entry.product.code]) {
    <div class="alert alert-danger">
      <span class="alert-icon">
        <cx-icon [type]="iconTypes.ERROR"></cx-icon>
      </span>
      <span>
        <a
          [routerLink]="
            { cxRoute: 'product', params: cartModification.entry.product }
              | cxUrl
          "
        >
          {{ cartModification.entry.product.name }}
        </a>
        {{ 'validation.productOutOfStock' | cxTranslate }}
      </span>

      <button
        class="close"
        type="button"
        title="{{ 'common.close' | cxTranslate }}"
        [attr.aria-label]="'common.close' | cxTranslate"
        (click)="removeMessage(cartModification)"
      >
        <cx-icon [type]="iconTypes.CLOSE"></cx-icon>
      </button>
    </div>
  }
}
