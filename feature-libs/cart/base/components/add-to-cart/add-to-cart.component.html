@if (productCode) {
  <form [formGroup]="addToCartForm" (submit)="addToCart()">
    @if (showQuantity) {
      <div class="quantity">
        <label>{{ 'addToCart.quantityFull' | cxTranslate }}</label>
        <div class="cx-counter-stock">
          @if (hasStock) {
            <cx-item-counter
              [max]="maxQuantity"
              [control]="addToCartForm.get('quantity')"
              [ariaDescribedById]="'add-to-card-stock-info'"
            ></cx-item-counter>
          }

          <span class="info" id="add-to-card-stock-info">
            @if (showInventory$ | async) {
              <span>{{ getInventory() }}</span>
            }
            {{
              hasStock
                ? ('addToCart.inStock' | cxTranslate)
                : ('addToCart.outOfStock' | cxTranslate)
            }}</span
          >
        </div>
      </div>
    }

    @if (hasStock) {
      <ng-template
        [cxOutlet]="CartOutlets.ADD_TO_CART_PICKUP_OPTION"
        [(cxComponentRef)]="pickupOptionCompRef"
        (cxComponentRefChange)="onPickupOptionsCompLoaded()"
      ></ng-template>
    }

    @if (hasStock) {
      <button
        #addToCartDialogTriggerEl
        [ngClass]="
          options?.displayAddToCart
            ? 'btn btn-tertiary'
            : 'btn btn-primary btn-block'
        "
        type="submit"
        [disabled]="
          disabled || quantity <= 0 || quantity > maxQuantity || unavailable
        "
        [attr.aria-label]="
          product?.name
            ? ('addToCart.addToCart' | cxTranslate) + ', ' + product?.name
            : ('addToCart.addToCart' | cxTranslate)
        "
      >
        @if (
          options?.addToCartString === ('addToCart.buyItAgain' | cxTranslate) &&
          !unavailable
        ) {
          <span class="repeat-icon"
            ><cx-icon [type]="iconTypes.REPEAT"></cx-icon
          ></span>
        }
        <span
          [ngClass]="
            options?.addToCartString === ('addToCart.buyItAgain' | cxTranslate)
              ? 'buyItAgainLink'
              : ''
          "
        >
          {{
            unavailable
              ? ('addToCart.unavailable' | cxTranslate)
              : (options?.addToCartString ??
                ('addToCart.addToCart' | cxTranslate))
          }}
        </span>
      </button>
    }
  </form>
}
