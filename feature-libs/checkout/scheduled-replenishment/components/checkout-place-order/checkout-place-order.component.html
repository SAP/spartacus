<form class="cx-place-order-form form-check" [formGroup]="checkoutSubmitForm">
  <div class="form-group">
    <label>
      <input
        formControlName="termsAndConditions"
        class="scaled-input form-check-input"
        type="checkbox"
      />
      <span class="form-check-label">
        {{ 'checkoutReview.confirmThatRead' | cxTranslate }}
        <a
          [routerLink]="{ cxRoute: 'termsAndConditions' } | cxUrl"
          class="cx-tc-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          {{ 'checkoutReview.termsAndConditions' | cxTranslate }}
        </a>
      </span>
    </label>
  </div>

  <ng-container *cxFeature="'enableCartSlowNetworkResilience'">
    <button
      (click)="submitForm()"
      class="btn btn-primary btn-block"
      [disabled]="
        termsAndConditionInvalid ||
        (daysOfWeekNotChecked$ | async) ||
        (isCartUpdating$ | async)
      "
      [cxAtMessage]="'checkoutReview.orderInProcess' | cxTranslate"
    >
      {{ 'checkoutReview.placeOrder' | cxTranslate }}
    </button>
  </ng-container>
  <ng-container *ngIf="!isSlowNetworkResilienceEnabled()">
    <button
      (click)="submitForm()"
      class="btn btn-primary btn-block"
      [disabled]="termsAndConditionInvalid || (daysOfWeekNotChecked$ | async)"
      [cxAtMessage]="'checkoutReview.orderInProcess' | cxTranslate"
    >
      {{ 'checkoutReview.placeOrder' | cxTranslate }}
    </button>
  </ng-container>
</form>
<ng-container *cxFeature="'enableCartSlowNetworkResilience'">
  <div
    class="cx-place-order-cart-updating"
    aria-live="polite"
    [hidden]="!(isCartUpdating$ | async)"
  >
    {{ 'checkoutReview.cartUpdating' | cxTranslate }}
  </div>
</ng-container>
