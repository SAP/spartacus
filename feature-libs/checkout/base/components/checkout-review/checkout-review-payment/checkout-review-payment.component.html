<ng-container *cxFeature="'a11yImproveCheckoutFocus'">
  @if (paymentDetails$ | async; as paymentDetails) {
    <div class="cx-review-summary" [cxFocus]="{ autofocus: true }">
      <div class="cx-review-summary-card cx-review-summary-payment-card">
        <div>
          <cx-card [content]="getBillingAddressCard(paymentDetails) | async" />
        </div>
        <div class="cx-review-summary-edit-step">
          <a
            [attr.title]="'checkoutReview.editBillingDetails' | cxTranslate"
            [routerLink]="{ cxRoute: paymentDetailsStepRoute } | cxUrl"
          >
            <cx-icon aria-hidden="true" [type]="iconTypes.PENCIL" />
          </a>
        </div>
      </div>
      <div class="cx-review-summary-card cx-review-summary-payment-card">
        <div>
          <cx-card [content]="getPaymentMethodCard(paymentDetails) | async" />
        </div>
        <div class="cx-review-summary-edit-step">
          <a
            [attr.title]="'checkoutReview.editPaymentDetails' | cxTranslate"
            [routerLink]="{ cxRoute: paymentDetailsStepRoute } | cxUrl"
          >
            <cx-icon aria-hidden="true" [type]="iconTypes.PENCIL" />
          </a>
        </div>
      </div>
    </div>
  }
</ng-container>
