<section [attr.aria-label]="'checkoutProgress.deliveryMode' | cxTranslate">
  <fieldset
    *cxFeature="'a11yDeliveryModeFocusPreservation'"
    role="radiogroup"
    [cxFocus]="{ autofocus: true, refreshFocus: isUpdating$ | async }"
  >
    <legend class="cx-checkout-title d-none d-lg-block d-xl-block">
      {{ 'checkoutMode.deliveryOptions' | cxTranslate }}
    </legend>
    <ng-container
      *ngIf="
        !(isUpdating$ | async) &&
          (supportedDeliveryModes$ | async) as supportedDeliveryModes;
        else loading
      "
    >
      <div [formGroup]="mode" class="cx-delivery-mode-wrapper">
        <div class="form-check" *ngFor="let mode of supportedDeliveryModes">
          <input
            [attr.aria-checked]="getAriaChecked(mode.code)"
            class="form-check-input"
            type="radio"
            (change)="changeMode(mode.code, $event)"
            (click)="changeMode(mode.code, $event)"
            [value]="mode.code"
            formControlName="deliveryModeId"
            id="deliveryMode-{{ mode.code }}"
            [cxFocus]="{ key: mode.code }"
            [attr.aria-label]="
              mode.name +
              ' ' +
              mode.description +
              ' ' +
              mode.deliveryCost?.formattedValue
            "
          />
          <label
            class="cx-delivery-label form-check-label form-radio-label"
            for="deliveryMode-{{ mode.code }}"
            aria-hidden="true"
          >
            <div class="cx-delivery-mode">
              {{ mode.name }}
              <span class="cx-delivery-mode-description"
                >({{ mode.description }})</span
              >
            </div>
            <div class="cx-delivery-price">
              {{ mode.deliveryCost?.formattedValue }}
            </div>
            <div class="cx-delivery-details"></div>
          </label>
        </div>
        <ng-template
          [cxOutlet]="CartOutlets.DELIVERY_MODE"
          [cxOutletContext]="{
            item: activeCartFacade.getActive() | async,
          }"
        >
        </ng-template>
      </div>
    </ng-container>
  </fieldset>

  <fieldset *cxFeature="'!a11yDeliveryModeFocusPreservation'" role="radiogroup">
    <legend class="cx-checkout-title d-none d-lg-block d-xl-block">
      {{ 'checkoutMode.deliveryOptions' | cxTranslate }}
    </legend>
    <ng-container
      *ngIf="
        !(isUpdating$ | async) &&
          (supportedDeliveryModes$ | async) as supportedDeliveryModes;
        else loading
      "
    >
      <div [formGroup]="mode" class="cx-delivery-mode-wrapper">
        <div class="form-check" *ngFor="let mode of supportedDeliveryModes">
          <input
            [attr.aria-checked]="getAriaChecked(mode.code)"
            class="form-check-input"
            type="radio"
            (change)="changeMode(mode.code, $event)"
            (click)="changeMode(mode.code, $event)"
            [value]="mode.code"
            formControlName="deliveryModeId"
            id="deliveryMode-{{ mode.code }}"
            [attr.aria-label]="
              mode.name +
              ' ' +
              mode.description +
              ' ' +
              mode.deliveryCost?.formattedValue
            "
          />
          <label
            class="cx-delivery-label form-check-label form-radio-label"
            for="deliveryMode-{{ mode.code }}"
            aria-hidden="true"
          >
            <div class="cx-delivery-mode">
              {{ mode.name }}
              <span class="cx-delivery-mode-description"
                >({{ mode.description }})</span
              >
            </div>
            <div class="cx-delivery-price">
              {{ mode.deliveryCost?.formattedValue }}
            </div>
            <div class="cx-delivery-details"></div>
          </label>
        </div>
        <ng-template
          [cxOutlet]="CartOutlets.DELIVERY_MODE"
          [cxOutletContext]="{
            item: activeCartFacade.getActive() | async,
          }"
        >
        </ng-template>
      </div>
    </ng-container>
  </fieldset>

  <ng-container *ngIf="activeCartFacade.hasPickupItems() | async">
    <ng-container *cxFeature="'!enableBundles'">
      <h2 class="cx-checkout-title d-none d-lg-block d-xl-block">
        {{ 'checkoutMode.deliveryEntries' | cxTranslate }}
      </h2>
      <ng-template
        [cxOutlet]="CartOutlets.CART_ITEM_LIST"
        [cxOutletContext]="{
          items: activeCartFacade.getDeliveryEntries() | async,
          readonly: true,
        }"
      >
      </ng-template>
    </ng-container>
    <!-- CART ITEM AND HIERACHYTREE SECTION -->
    <ng-container *cxFeature="'enableBundles'">
      <h2 class="cx-delivery-mode-header">
        {{ 'checkoutMode.deliveryEntries' | cxTranslate }}
      </h2>
      <ng-container *ngIf="entries$ | async as entries">
        <ng-container *ngIf="entryGroups$ | async as entryGroups">
          <div class="cx-delivery-mode-cart-item">
            <div
              [ngClass]="entries.length === 0 ? 'emptyList' : 'noneEmptyList'"
            >
              <ng-template
                [cxOutlet]="CartOutlets.CART_ITEM_LIST"
                [cxOutletContext]="{
                  items: entries,
                  readonly: true,
                }"
              >
              </ng-template>
            </div>
            <ng-container *ngFor="let bundle of bundles$ | async">
              <cx-hierarchy
                [options]="{
                  tree: bundle,
                  template: bundlesTemplate,
                  onItemRemove: removeBundle.bind(this),
                  titleReadonly: true,
                  collasibleReadonly: true,
                }"
              >
              </cx-hierarchy>

            </ng-container>
          </div>
        </ng-container>
      </ng-container>
    </ng-container>
  </ng-container>

  <ng-template #loading>
    <div class="cx-spinner">
      <cx-spinner></cx-spinner>
    </div>
  </ng-template>

  <ng-container cxInnerComponentsHost></ng-container>

  <div class="row cx-checkout-btns">
    <div class="col-md-12 col-lg-6">
      <button class="btn btn-block btn-secondary" (click)="back()">
        {{ backBtnText | cxTranslate }}
      </button>
    </div>
    <div class="col-md-12 col-lg-6">
      <button
        class="btn btn-block btn-primary"
        [disabled]="
          deliveryModeInvalid || (isSetDeliveryModeHttpError$ | async)
        "
        (click)="next()"
      >
        {{ 'common.continue' | cxTranslate }}
      </button>
    </div>
  </div>

  <ng-template #bundlesTemplate let-items>
    <ng-template
      [cxOutlet]="CartOutlets.CART_ITEM_LIST"
      [cxOutletContext]="{
        items: items,
        hasHeader: false,
        readonly: true,
      }"
    />
  </ng-template>
</section>
