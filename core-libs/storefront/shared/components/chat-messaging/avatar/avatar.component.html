@if (message) {
  <div
    class="cx-avatar"
    [ngClass]="{ 'right-align': message.rightAlign }"
    >
    @if (!message.rightAlign && message?.author) {
      <span>
        {{ getInitials(message?.author || '') }}
      </span>
    }
    @if (!message.rightAlign && !message?.author) {
      <cx-icon
        [type]="iconTypes.USER"
        />
    }
    @if (message.rightAlign) {
      <cx-icon [type]="iconTypes.HEADSET" />
    }
  </div>
}
