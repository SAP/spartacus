@if (getItems() | async; as items) {
  <cx-carousel
    [items]="items"
    [template]="template"
    itemWidth="100%"
    class="inline-navigation"
    />
}

<ng-template #template let-item="item">
  <ng-container
    [cxComponentWrapper]="{
      flexType: item.typeCode,
      typeCode: item.typeCode,
      uid: item?.uid,
    }"
    />
</ng-template>
