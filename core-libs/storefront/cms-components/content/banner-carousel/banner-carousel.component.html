<cx-carousel
  *ngIf="getItems() | async as items"
  [items]="items"
  [template]="template"
  itemWidth="100%"
  class="inline-navigation"
></cx-carousel>

<ng-template #template let-item="item">
  <ng-container *cxFeature="'enableSmartEditContractForDirectSlotChildrenOnly'">
    <ng-container
      [cxComponentWrapper]="{
        flexType: item.typeCode,
        typeCode: item.typeCode,
        uid: item?.uid,
      }"
      [cxComponentWrapperNested]="true"
    >
    </ng-container>
  </ng-container>
  <ng-container *cxFeature="'!enableSmartEditContractForDirectSlotChildrenOnly'">
    <ng-container
      [cxComponentWrapper]="{
        flexType: item.typeCode,
        typeCode: item.typeCode,
        uid: item?.uid,
      }"
    >
    </ng-container>
  </ng-container>
</ng-template>
