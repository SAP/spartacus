<div
  #messageContainer
  [ngClass]="getCssClassesForMessage"
  class="cx-message"
  tabindex="0"
>
  <div class="cx-message-content">
    <div role="presentation" class="cx-message-header">
      <span role="presentation" class="cx-message-icon">
        <cx-icon role="presentation" [type]="getIconType" />
      </span>

      <span class="cx-message-text">
        {{ text }}
      </span>

      @if (accordionText) {
        <button
          (click)="showBody = !showBody"
          [attr.aria-expanded]="showBody"
          [attr.aria-label]="accordionText"
          class="cx-message-accordion-button link cx-action-link"
          type="button"
        >
          {{ accordionText }}
          <cx-icon
            [type]="showBody ? 'CARET_UP' : 'CARET_DOWN'"
            class="cx-message-accordion-icon"
          />
        </button>
      }

      @if (actionButtonText) {
        <button
          (click)="buttonAction.emit()"
          [cxAtMessage]="actionButtonMessage"
          class="btn btn-link cx-action-link"
          type="button"
        >
          {{ actionButtonText }}
        </button>
      }

      @if (isVisibleCloseButton) {
        <button
          (click)="closeMessage.emit()"
          [attr.aria-label]="'common.close' | cxTranslate"
          [cxAtMessage]="'common.close' | cxTranslate"
          title="{{ 'common.close' | cxTranslate }}"
          class="close"
          type="button"
        >
          <cx-icon [type]="iconTypes.CLOSE" />
        </button>
      }
    </div>

    @if (showBody || !accordionText) {
      <div class="cx-message-body">
        <ng-content />
      </div>
    }
  </div>
</div>
