@if (promotions) {
  <div class="cx-promotions">
    @if (promotions.length === 1) {
      <p>{{ promotions[0].description }}</p>
    }
    @if (promotions.length > 1) {
      <ul>
        @for (promotion of promotions; track promotion) {
          <li>
            {{ promotion.description }}
          </li>
        }
      </ul>
    }
  </div>
}
