@if (facetList$ | async; as facetList) {
  @if (facetList.activeFacets && facetList.activeFacets.length > 0) {
    <div id="cx-active-facets-groupName">
      {{ 'productList.appliedFilter' | cxTranslate }}
    </div>
  }
  @for (facet of facetList?.activeFacets; track facet) {
    <a
      *cxFeature="'a11yFilteredFacetAnnouncement'"
      routerLink="./"
      [queryParams]="getLinkParams(facet)"
      [cxFocus]="{ key: getFocusKey(facetList, facet) }"
      role="button"
      (keydown.space)="removeFilterWithSpacebar($event)"
      [attr.aria-label]="
        'productList.activeFilter'
          | cxTranslate: { filter: facet.facetValueName }
      "
      [attr.title]="
        'productList.activeFilter'
          | cxTranslate: { filter: facet.facetValueName }
      "
      [cxAtMessage]="
        'productList.filterRemoved'
          | cxTranslate: { filter: facet.facetValueName }
      "
    >
      <span>{{ facet.facetValueName }}</span>
      <cx-icon aria-hidden="true" [type]="closeIcon" />
    </a>
    <a
      *cxFeature="'!a11yFilteredFacetAnnouncement'"
      routerLink="./"
      [queryParams]="getLinkParams(facet)"
      [cxFocus]="{ key: getFocusKey(facetList, facet) }"
      role="button"
      (keydown.space)="removeFilterWithSpacebar($event)"
      [attr.aria-label]="
        'productList.activeFilter'
          | cxTranslate: { filter: facet.facetValueName }
      "
      [attr.title]="
        'productList.activeFilter'
          | cxTranslate: { filter: facet.facetValueName }
      "
    >
      <span>{{ facet.facetValueName }}</span>
      <cx-icon aria-hidden="true" [type]="closeIcon" />
    </a>
  }
}
